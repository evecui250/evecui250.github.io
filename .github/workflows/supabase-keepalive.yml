name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://mjsgcvuyousczqexxszs.supabase.co/rest/v1/rpc/quiz_ping" \
            -H "apikey: sb_publishable_WEmGQIZnbWUMSXm9oKSWdQ_l7tDrIIE" \
            -H "Content-Type: application/json" -d '{}'
