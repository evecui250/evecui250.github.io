<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>该结婚还是分手？</title>
<meta name="description" content="42 道题，从三观、现实、相处、家庭、感情、人品、自己七个维度，看清你们这段关系。">
<style>
  :root{
    --bg:#faf6f1; --card:#ffffff; --ink:#2b2522; --muted:#8a7f78; --line:#ece4dc;
    --accent:#b4535b; --accent-soft:#f6e3e2; --good:#5d8a6a; --mid:#c79a3e; --bad:#b4535b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif}
  h1{font-size:34px;line-height:1.25;margin:48px 0 12px;letter-spacing:1px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 28px}
  .pie{width:100%;max-width:340px;margin:4px auto 28px;aspect-ratio:1}
  .pie svg{width:100%;height:100%;display:block;overflow:visible}
  .pie .seg{transform-origin:170px 170px;animation:pop .6s cubic-bezier(.2,.8,.3,1.2) both}
  .pie .lbl{font-size:14px;font-weight:600;fill:#fff;letter-spacing:1px;pointer-events:none}
  .pie .ctr1{font-size:30px;font-weight:700;fill:var(--ink)}
  .pie .ctr2{font-size:13px;fill:var(--muted);letter-spacing:2px}
  @keyframes pop{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
  .modules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 28px}
  .modules div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
  .modules b{display:block;font-size:15px;margin-bottom:2px}
  .modules span{color:var(--muted);font-size:12.5px}
  .note{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:28px}
  button{font:inherit;cursor:pointer;border:none}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;letter-spacing:1px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:12px}
  .hidden{display:none!important}

  /* quiz */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .link{background:none;color:var(--muted);font-size:14px;padding:6px 0}
  .link:disabled{opacity:.3}
  .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .mod{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:8px}
  .q{font-size:21px;font-weight:600;line-height:1.45;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s}
  .opt.na{color:var(--muted);border-style:dashed}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  @media (hover:hover){.opt:hover{border-color:#d9b8b6}}

  /* result */
  #card{background:var(--bg);padding:4px 2px 2px}
  .r-head{text-align:center;margin:20px 0 8px}
  .r-title{font-size:15px;color:var(--accent);letter-spacing:2px;margin-bottom:14px}
  .r-label{font-size:13px;color:var(--muted);letter-spacing:2px}
  .score{font-size:72px;font-weight:700;line-height:1.1;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .score small{font-size:20px;color:var(--muted);font-weight:500}
  .verdict{font-size:24px;font-weight:700;margin:10px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
  .card h3{margin:0 0 12px;font-size:16px}
  .card p{margin:0 0 10px;font-size:15.5px}
  .card p:last-child{margin-bottom:0}
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
  .row-top b{font-variant-numeric:tabular-nums}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px}
  .row-note{font-size:13.5px;color:var(--muted);margin-top:5px}
  .flag{border-color:#e7b9b5;background:#fdf1f0}
  .flag h3{color:var(--bad)}
  .flag li{margin-bottom:4px}
  ul{margin:0;padding-left:20px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{background:var(--accent-soft);color:var(--accent);font-size:13.5px;padding:4px 10px;border-radius:20px}
  .tags.gray span{background:#efeae4;color:var(--muted)}
  .brand{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:1px}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 保存图片弹层 */
  .overlay{position:fixed;inset:0;background:rgba(30,24,22,.82);z-index:10;display:flex;flex-direction:column;align-items:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom));overflow:auto}
  .overlay p{color:#fff;font-size:15px;margin:4px 0 12px;text-align:center}
  .overlay img{width:100%;max-width:420px;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
  .overlay button{margin-top:16px;background:#fff;color:var(--ink);padding:10px 28px;border-radius:22px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="intro" class="fade">
    <h1 class="serif">该结婚<br>还是<em>分手</em>？</h1>
    <p class="lead">从七个维度，给这段关系做一次体检。</p>
    <div class="pie" id="pie"></div>
    <div class="note">按真实情况选，不是按你希望的样子选。遇到不适用的题，选“还没…”那一项就好，不会扣分。答案只保存在你自己的手机上。</div>
    <button class="btn" id="startBtn">开始测试</button>
    <button class="btn ghost hidden" id="resumeBtn">继续上次的进度</button>
    <button class="btn ghost hidden" id="lastBtn">查看上次的结果</button>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="hidden">
    <div class="top">
      <button class="link" id="backBtn">‹ 上一题</button>
      <button class="link" id="homeBtn1">首页</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="qbox"></div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="hidden"></section>

</div>

<script>
// ---------- 题库 ----------
// 选项按从理想到不理想排列；[文字, 分数 0-4 或 null(不适用，不计分), 红线说明(可选)]
const MODULES = [
  { name:"三观契合", key:"values", qs:[
    { tag:"金钱观", q:"在钱的事上（怎么花、怎么存、要不要一起管），你们？", o:[
      ["想法差不多",4],["有不同，但能商量出办法",3],["有不同，常常因此不愉快",1],["还没认真聊过",null]]},
    { tag:"要不要孩子", q:"要不要孩子、什么时候要？", o:[
      ["想法一致（要或不要都算）",4],["有些分歧，还在商量",2],["分歧很大，谁都不想让步",0],["还没认真聊过",null]]},
    { tag:"在哪生活", q:"以后在哪个城市生活？", o:[
      ["已经有共识",4],["有分歧，还在商量",2],["分歧很大，总有一方要放弃",0],["还没认真聊过",null]]},
    { tag:"事业与家庭", q:"对你的事业或学业，TA的态度？", o:[
      ["支持，会帮我一起想",4],["不太过问，但尊重我的选择",3],["希望我把重心多放在家庭上",1],["不太支持，常常唱反调",0]]},
    { tag:"家务分工", q:"家务和生活琐事，你们怎么分？", o:[
      ["两个人都会主动做",4],["一方做得多一些，双方都能接受",3],["主要是一方在做，TA/我心里有怨气",1],["还没一起生活过",null]]},
    { tag:"一起做决定", q:"遇到大事（买房、换工作），一般怎么决定？", o:[
      ["一起商量",4],["一方拿主意，另一方也乐意",3],["一方拿主意，另一方有意见但不说",1]]},
  ]},
  { name:"现实基础", key:"reality", qs:[
    { tag:"经济状况", q:"你们的经济条件和消费习惯？", o:[
      ["差不多，或差距不影响相处",4],["有差距，偶尔会别扭",2],["差距让我们常有压力或心结",1],["TA有债务等经济问题，我不太清楚详情",0]]},
    { tag:"成长背景", q:"你们的成长环境和教育背景？", o:[
      ["相近，很多事一点就通",4],["不太一样，但能互相理解",3],["差别大，很多事说不到一起",1]]},
    { tag:"结婚意愿", q:"对结婚这件事，你们俩的意愿？", o:[
      ["都想结，时间也合得上",4],["都想结，但一方想晚一些",3],["我自己其实还没想好",2],["一方想结，另一方一直回避",0]]},
    { tag:"异地", q:"你们现在住在一个城市吗？", o:[
      ["在同一个城市",4],["异地，有明确的结束时间",3],["异地，什么时候结束还不确定",1]]},
    { tag:"TA的工作", q:"TA的工作状态？", o:[
      ["稳定，或有清晰的方向",4],["不算稳定，但在努力",3],["一直没什么方向",1]]},
    { tag:"共同经历", q:"你们在一起多久了？", o:[
      ["一年以上，一起经历过难事",4],["一年以上，还没遇到大的考验",3],["不到一年",2]]},
  ]},
  { name:"日常相处", key:"daily", qs:[
    { tag:"吵架后", q:"有矛盾之后，通常怎么收场？", o:[
      ["能把话说开，事情真正解决",4],["很少有矛盾",3],["过一阵就和好了，但问题还在",2],["冷战很久，或越吵越凶",0]]},
    { tag:"做自己", q:"和TA在一起时，你说话做事？", o:[
      ["很放松，想说什么就说",4],["大多时候放松，偶尔会顾虑",3],["常常要掂量着说",1]]},
    { tag:"被支持", q:"你遇到难事时，TA？", o:[
      ["是我第一个想找的人，也帮得上",4],["会关心，但不太帮得上",3],["我不太会找TA",1],["找了TA，反而会被说",0]]},
    { tag:"聊天", q:"你们平时聊天？", o:[
      ["什么都能聊，也聊得深",4],["日常能聊，深的话题少",3],["话越来越少，多是琐事",1]]},
    { tag:"吵架底线", q:"吵架时，TA最激烈会到什么程度？", o:[
      ["声音大一点，但不伤人",4],["偶尔说重话，过后会道歉",2],["常说难听的话、贬低我",0,"经常言语贬低、辱骂"],["摔过东西、推搡或动过手",0,"有暴力行为（摔东西/推搡/动手）"]]},
    { tag:"个人空间", q:"在一起的时间和各自的空间？", o:[
      ["各有空间，在一起的时间也够",4],["有一方偶尔觉得不够，或太黏",3],["在一起的时间很少，各过各的",1],["TA会管我和谁见面、要我随时报备",0,"控制欲强（干涉社交、要求随时报备）"]]},
  ]},
  { name:"双方家庭", key:"family", qs:[
    { tag:"TA家人的态度", q:"TA的家人对你？", o:[
      ["很接纳我",4],["客气，有点距离",3],["对我不太满意",1],["还没见过，或还不了解",null]]},
    { tag:"你家人的态度", q:"你的家人对TA？", o:[
      ["喜欢TA",4],["没什么意见",3],["有些担心或反对",1],["还没见过，或还不了解",null]]},
    { tag:"家庭矛盾", q:"你和TA家人有矛盾时，TA？", o:[
      ["讲道理，也会护着我",4],["两边劝，谁也不得罪",2],["多半让我先忍一忍",1],["还没遇到过",null]]},
    { tag:"原生家庭边界", q:"TA和父母之间？", o:[
      ["自己拿主意，会参考父母意见",4],["比较听父母的，大事上有主见",3],["很多事要父母点头",1]]},
    { tag:"彩礼/房子", q:"彩礼、嫁妆、买房这些事？", o:[
      ["谈过或不涉及，双方都没意见",4],["有分歧，还在商量",2],["分歧大，已经闹得不愉快",0],["还没谈",null]]},
    { tag:"家庭负担", q:"TA家里有需要你们长期承担的负担吗？", o:[
      ["没有明显负担",4],["有一些，我们一起商量过",3],["有，但TA没怎么跟我说清楚",1]]},
  ]},
  { name:"感情浓度", key:"love", qs:[
    { tag:"一辈子", q:"想到要和TA过一辈子，你的第一感觉？", o:[
      ["踏实，有期待",4],["挺好，但有点犹豫",2],["心里有点抗拒",0]]},
    { tag:"想过分手", q:"过去半年，你想过分手吗？", o:[
      ["没有",4],["吵架时闪过念头",3],["认真想过几次",1],["经常想",0]]},
    { tag:"心动", q:"你还会被TA吸引吗？", o:[
      ["还是常常心动",4],["偶尔",3],["很少了",1]]},
    { tag:"被爱的感觉", q:"你能感觉到TA爱你吗？", o:[
      ["能清楚感觉到",4],["大体能感觉到",3],["说不太清",1]]},
    { tag:"欣赏", q:"对TA这个人（为人、能力、做事方式）？", o:[
      ["很欣赏",4],["欣赏和不满差不多",2],["不满更多一些",1]]},
    { tag:"亲密关系", q:"身体上的亲密，你们合拍吗？", o:[
      ["合拍，彼此都满意",4],["有些落差，能沟通",3],["落差挺大，不太好开口",1],["不适用 / 不想回答",null]]},
    { tag:"重新选择", q:"如果没有年龄、父母、已经投入的时间这些压力，你还会选TA吗？", o:[
      ["会",4],["大概会",3],["不确定",1],["不会",0]]},
  ]},
  { name:"我自己", key:"self", qs:[
    { tag:"为什么想结婚", q:"想到结婚，你心里更多是？", o:[
      ["想和TA一起过日子",4],["一半是想和TA在一起，一半是到了年龄",2],["主要是年龄到了、家里在催",1],["想借结婚离开现在的处境",0]]},
    { tag:"想要的婚姻", q:"你清楚自己想要什么样的婚姻吗？", o:[

    { tag:"接受现在的TA", q:"假设TA以后都不会变，你能接受现在的TA吗？", o:[

      ["很稳定",4],["偶尔急，能自己平复",3],["常发脾气，需要人哄",1]]},
    { tag:"不良嗜好", q:"赌博、酗酒、网贷、沉迷游戏这类事，TA？", o:[

    { tag:"靠谱", q:"TA答应的事？", o:[

    { tag:"认错", q:"TA做错事之后？", o:[

    { tag:"生活习惯", q:"你们的作息、卫生、娱乐习惯？", o:[

// 每个模块按分数段（≥75 / 55–74 / <55）的点评
const MOD_NOTES = {
  values:   ["你们对未来的想象很接近，这是婚姻最难得的底子。","大方向一致，但有几件事需要摊开谈清楚，最好在结婚前。","你们想要的生活不太一样。三观差异不会因为结婚消失，只会在柴米油盐里放大。"],
  reality:  ["现实条件稳当，结婚后少很多后顾之忧。","现实层面有些需要一起解决的课题，不致命，但别忽视。","现实条件压力不小。爱可以克服很多事，但最好先看清要克服的是什么。"],

const TIERS = [
  { min:85, title:"可以认真考虑结婚了", color:"var(--good)",
    text:["你们在大部分维度都很合拍：三观相近，相处舒服，彼此欣赏。这样的关系不多见。","没有完美的关系。下面列出的地方，婚前花点时间谈清楚，以后的路会更顺。"] },
  { min:70, title:"底子不错，先把几件事谈清楚", color:"var(--good)",
    text:["你们的感情基础是好的，只是有几处还没对齐。这些问题本身不致命，危险的是一直不谈。","建议找个安静的时间，把下面几个话题逐个聊开。如果能谈出共识，你们会是很好的伴侣。"] },
  { min:55, title:"站在十字路口，先别急着结婚", color:"var(--mid)",
    text:["这段关系有真实的好，也有真实的问题。现在结婚，问题会被带进婚姻里，而婚姻通常不会让问题变小。","这不是坏结果，它只是在提醒你：先一起解决问题，再决定要不要往前走。给彼此半年时间，看看对方愿不愿意为这段关系改变。你值得一段让你安心的感情。"] },
  { min:40, title:"问题比甜蜜多，认真想一想", color:"var(--bad)",
    text:["你们之间的问题已经不是小摩擦了。也许你还爱TA，也许是放不下投入的时间，这两种都很正常。","可以给自己定一个期限，把最核心的问题明确提出来，看TA的反应。如果期限到了什么都没变，就要诚实地面对答案。离开一段不合适的关系，不是失败，是对自己负责。"] },
  { min:0, title:"建议分手", color:"var(--bad)",
    text:["从你的回答来看，这段关系在多个方面都让你受累：三观、相处、感情或者TA本人，很难找到支撑你们走下去的东西。","说出来可能很难，但婚姻不会让一段不合适的关系变好。你不需要等到彻底心死才离开。把时间和心力留给更爱你、也更适合你的人，包括你自己。"] },
];

const RED_TIER = { title:"有红线问题，建议认真考虑分手", color:"var(--bad)",
  text:["你的回答里出现了下面这些情况。不管其他方面多好，这些都是婚姻里很难修复、而且往往会越来越严重的问题。","它们不是你不够好或者不够包容，也不会因为结了婚就改变。请先把自己的安全和感受放在第一位，和信任的朋友或家人聊聊。如果涉及暴力，请记得寻求专业帮助。"] };

// ---------- 状态 ----------
const QUESTIONS = [];
MODULES.forEach((m,mi)=>m.qs.forEach((q,qi)=>QUESTIONS.push({...q, mi, qi})));
const TOTAL = QUESTIONS.length;
let answers = new Array(TOTAL).fill(null);   // 按题目原始编号存
let order = [...Array(TOTAL).keys()];           // 本次答题的出题顺序
let cur = 0;                                    // 当前是第几题（按出题顺序）
const KEY = "marry-quiz-v3";

// 打乱题目顺序；前 3 题不放红线类的重题，开头轻松一点
function makeOrder(){
  const heavy = new Set(QUESTIONS.map((q,i)=>q.o.some(o=>o[2])?i:-1).filter(i=>i>=0));
  let a;
  do{
    a=[...Array(TOTAL).keys()];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  }while(a.slice(0,3).some(i=>heavy.has(i)));
  return a;
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,order,cur}));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}
const LAST_KEY = "marry-quiz-last-v1";
function saveLast(){try{localStorage.setItem(LAST_KEY,JSON.stringify({answers,time:Date.now()}));}catch(e){}}
function loadLast(){try{const l=JSON.parse(localStorage.getItem(LAST_KEY));return (l&&Array.isArray(l.answers)&&l.answers.length===TOTAL&&l.answers.every(a=>a!==null))?l:null;}catch(e){return null;}}

const $ = id=>document.getElementById(id);
function show(id){["intro","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

function goHome(){
  checkResume();
  show("intro");
}
function checkResume(){
  const has = answers.some(a=>a!==null) && answers.some(a=>a===null);
  $("resumeBtn").classList.toggle("hidden", !has);
  $("startBtn").textContent = has ? "重新开始" : "开始测试";
  const last = loadLast();
  if(last){const d=new Date(last.time);$("lastBtn").textContent=`查看上次的结果（${d.getMonth()+1}月${d.getDate()}日）`;}
  $("lastBtn").classList.toggle("hidden", !last);
}

function start(fresh){
  if(fresh){answers=new Array(TOTAL).fill(null);order=makeOrder();cur=0;save();}
  show("quiz");render();
}

function render(){
  const qi=order[cur], q=QUESTIONS[qi];
  $("count").textContent=`${cur+1} / ${TOTAL}`;
  $("bar").style.width=`${cur/TOTAL*100}%`;
  $("backBtn").disabled = cur===0;
  const box=$("qbox");
  box.innerHTML=`<div class="fade">
    <p class="q">${q.q}</p>
    <div class="opts">${q.o.map((o,oi)=>`<button class="opt${o[1]===null?" na":""}${answers[qi]===oi?" sel":""}" data-i="${oi}">${o[0]}</button>`).join("")}</div>
  </div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
}

let locked=false;
function pick(i,btn){
  if(locked) return; locked=true;
  answers[order[cur]]=i; save();
  document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel");
  setTimeout(()=>{
    locked=false;
    if(cur<TOTAL-1){cur++;save();render();}
    else {$("bar").style.width="100%";showResult();}
  },260);
}

$("backBtn").onclick=()=>{if(cur>0){cur--;save();render();}};
$("homeBtn1").onclick=goHome;
$("startBtn").onclick=()=>start(true);
$("resumeBtn").onclick=()=>start(false);
$("lastBtn").onclick=()=>{const l=loadLast(); if(!l) return; showResult(l.answers, l.time);};

// ---------- 计算结果 ----------
function compute(answers){
  const mods=MODULES.map(()=>({sum:0,max:0}));
  const flags=[], weak=[], unknown=[];
  QUESTIONS.forEach((q,i)=>{
    const o=q.o[answers[i]];
    if(o[1]===null){unknown.push(q.tag);return;}
    mods[q.mi].sum+=o[1]; mods[q.mi].max+=4;
    if(o[2]) flags.push(o[2]);
    else if(o[1]<=1) weak.push(q.tag);
  });
  const valid = mods.map((m,i)=>m.max?{i,s:Math.round(m.sum/m.max*100)}:{i,s:null});
  const scored = valid.filter(v=>v.s!==null);
  // 加权平均：感情和人品最重要，现实条件相对次要
  const W = {values:1.2, reality:0.8, daily:1.2, family:1, love:1.5, self:1, character:1.5};
  const wsum = scored.reduce((a,v)=>a+W[MODULES[v.i].key],0);
  const total = Math.round(scored.reduce((a,v)=>a+v.s*W[MODULES[v.i].key],0)/wsum);
  return {modScores:valid.map(v=>v.s),total,flags,weak,unknown};
}

function colorFor(s){return s>=75?"var(--good)":s>=55?"var(--mid)":"var(--bad)";}

function showResult(ans, time){
  const fromHistory = !!ans;
  if(!fromHistory){ans=answers; saveLast(); clearSave(); answers=new Array(TOTAL).fill(null); cur=0;}
  const {modScores,total,flags,weak,unknown}=compute(ans);
  const d=new Date(time||Date.now()), dateStr=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  const tier = flags.length ? RED_TIER : TIERS.find(t=>total>=t.min);
  const rows = MODULES.map((m,i)=>{
    const s=modScores[i];
    if(s===null) return `<div class="row"><div class="row-top"><span>${m.name}</span><b style="color:var(--muted)">—</b></div><div class="row-note">这部分还不了解，暂不计分。</div></div>`;
    const band = s>=75?0:s>=55?1:2;
    return `<div class="row">
      <div class="row-top"><span>${m.name}</span><b style="color:${colorFor(s)}">${s}</b></div>
      <div class="track"><i style="width:${s}%;background:${colorFor(s)}"></i></div>
      <div class="row-note">${MOD_NOTES[m.key][band]}</div>
    </div>`;}).join("");

  const sc = modScores.map((s,i)=>({s,i})).filter(x=>x.s!==null);
  const hi = sc.reduce((a,b)=>b.s>a.s?b:a), lo = sc.reduce((a,b)=>b.s<a.s?b:a);
  const hl = (hi.s-lo.s >= 15)
    ? `<p>你们最稳的是<b>「${MODULES[hi.i].name}」</b>，最需要用心的是<b>「${MODULES[lo.i].name}」</b>。</p>` : "";

  $("result").innerHTML = `<div class="fade">
    <div class="top">
      <button class="link" id="homeBtn2">‹ 首页</button>
    </div>
    <div id="card">
      <div class="r-head">
        <div class="r-title serif">该结婚还是分手？</div>
        <div class="r-label">你们的关系总分 · ${dateStr}</div>
        <div class="score" style="color:${tier.color}">${total}<small> / 100</small></div>
        <div class="verdict serif" style="color:${tier.color}">${tier.title}</div>
      </div>
      ${flags.length?`<div class="card flag"><h3>⚠️ 红线问题</h3><ul>${flags.map(f=>`<li>${f}</li>`).join("")}</ul></div>`:""}
      <div class="card">${hl}${tier.text.map(t=>`<p>${t}</p>`).join("")}</div>
      <div class="card"><h3>七个维度</h3>${rows}</div>
      ${weak.length?`<div class="card"><h3>需要认真聊聊的地方</h3><div class="tags">${weak.map(w=>`<span>${w}</span>`).join("")}</div>
        <p class="row-note" style="margin-top:10px">这些是你打了低分的题。挑一两个最在意的，找个平静的时候和TA谈。TA的反应，本身就是答案的一部分。</p></div>`:""}
      ${unknown.length?`<div class="card"><h3>还没摸清楚的事</h3><div class="tags gray">${unknown.map(w=>`<span>${w}</span>`).join("")}</div>
        <p class="row-note" style="margin-top:10px">这些没有计入分数。${unknown.length>=3?"不少重要的事还没摸清，":""}结婚前，最好把它们都聊过、见过、经历过。</p></div>`:""}
      <div class="brand">evecui250.github.io/marry</div>
    </div>
    <button class="btn" id="saveBtn" style="margin-top:24px">保存结果图片</button>
    <button class="btn ghost" id="againBtn">重新测一次</button>
    <p class="foot">本测试仅供自我觉察参考，不构成专业的心理或婚恋咨询。<br>关系里的事，最终还是你自己最清楚。</p>
  </div>`;
  $("homeBtn2").onclick=goHome;
  $("againBtn").onclick=()=>start(true);
  $("saveBtn").onclick=saveImage;
  show("result");
}

// ---------- 保存图片 ----------
let h2cLoading=null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cLoading) h2cLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src="html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return h2cLoading;
}
async function saveImage(){
  const btn=$("saveBtn"); const old=btn.textContent;
  btn.textContent="生成中…"; btn.disabled=true;
  try{
    await loadH2C();
    const canvas = await html2canvas($("card"),{backgroundColor:"#faf6f1",scale:Math.min(3,(window.devicePixelRatio||2)),useCORS:true});
    const url = canvas.toDataURL("image/png");
    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`<p>长按图片保存到相册</p><img src="${url}" alt="测试结果"><button>关闭</button>`;
    ov.querySelector("button").onclick=()=>ov.remove();
    document.body.appendChild(ov);
    // 电脑上直接下载
    if(window.matchMedia("(hover:hover)").matches){
      const a=document.createElement("a"); a.href=url; a.download="该结婚还是分手-结果.png"; a.click();
    }
  }catch(e){
    alert("生成图片失败，可以直接截图保存哦");
  }finally{btn.textContent=old;btn.disabled=false;}
}

// ---------- 首页大圆 ----------
(function drawPie(){
  const C=170, R=150, r=74, gap=0.025, n=MODULES.length;
  const colors=["#c96b6f","#d99a6c","#c9a85a","#8fae7e","#6f9a9a","#8b86b8","#b07aa0"];
  const pt=(rad,a)=>[C+rad*Math.sin(a), C-rad*Math.cos(a)];
  let svg=`<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">`;
  MODULES.forEach((m,i)=>{
    const a0=i/n*2*Math.PI+gap, a1=(i+1)/n*2*Math.PI-gap, big=(a1-a0)>Math.PI?1:0;
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
    const d=`M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3}Z`;
    const am=(a0+a1)/2, [lx,ly]=pt((R+r)/2,am);
    svg+=`<g class="seg" style="animation-delay:${i*70}ms"><path d="${d}" fill="${colors[i]}"/>
      <text class="lbl" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central">${m.name}</text></g>`;
  });
  svg+=`<text class="ctr1 serif" x="${C}" y="${C-8}" text-anchor="middle" dominant-baseline="central">${TOTAL}</text>
        <text class="ctr2" x="${C}" y="${C+22}" text-anchor="middle" dominant-baseline="central">道题 · 约8分钟</text></svg>`;
  $("pie").innerHTML=svg;
})();

// 有未完成进度时显示“继续”
(function(){
  const s=load();
  if(s && Array.isArray(s.answers) && s.answers.length===TOTAL){
    answers=s.answers; cur=Math.min(s.cur||0, TOTAL-1);
    if(Array.isArray(s.order) && s.order.length===TOTAL) order=s.order;
  }
  checkResume();
})();
</script>
