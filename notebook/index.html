<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notebook</title>
<style>
  :root{
    --bg:#f6f1e8; --paper:#fffdf8; --ink:#2b2622; --muted:#8a7f74; --line:#e6ddcf;
    --accent:#8c5a3c; --accent-soft:#f1e4d8; --danger:#a5402f;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable;overflow-y:scroll}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:rgba(246,241,232,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .bar{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .brand{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.06em;text-decoration:none;color:var(--ink)}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:14px}
  main{max-width:760px;margin:0 auto;padding:28px 20px 80px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.3}
  h1{font-size:28px;margin:0 0 6px}
  h2{font-size:21px;margin:34px 0 12px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
  input,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical}
  .editor{font-family:var(--serif);font-size:18px;line-height:1.9;min-height:60vh;padding:18px}
  button,.btn{font:inherit;font-size:15px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}
  button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
  button.link{border:none;background:none;color:var(--muted);padding:4px 6px;font-size:14px}
  button.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .msg{margin-top:14px;font-size:14px;color:var(--accent);min-height:1em}
  .msg.err{color:var(--danger)}
  .chapter{margin-bottom:26px}
  .chapter-head{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
  .entries{display:grid;gap:10px}
  .entry{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s}
  .entry:hover{border-color:var(--accent)}
  .entry .t{font-family:var(--serif);font-size:18px}
  .entry .m{color:var(--muted);font-size:13px;margin-top:2px}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:13px}
  article .meta{color:var(--muted);font-size:14px;margin-bottom:26px}
  .prose{font-family:var(--serif);font-size:19px;line-height:2}
  .prose p{margin:0 0 1.1em;text-indent:2em}
  .comments{margin-top:44px;border-top:1px solid var(--line);padding-top:8px}
  .comment{padding:12px 0;border-bottom:1px dashed var(--line)}
  .comment .m{color:var(--muted);font-size:13px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
  .comment .c{white-space:pre-wrap}
  .thread{border-bottom:1px dashed var(--line)}
  .thread .comment{border-bottom:none}
  .comment.reply{margin-left:22px;padding:8px 0 8px 14px;border-left:2px solid var(--accent-soft)}
  .reply-box{margin-top:10px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .tabs{display:flex;gap:6px;margin-bottom:18px}
  .tabs button{background:transparent;color:var(--muted);border-color:var(--line)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
  .req{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .hidden{display:none!important}
  .save-state{color:var(--muted);font-size:13px}
  @media (max-width:520px){ .prose{font-size:18px} h1{font-size:24px} .card{padding:18px} }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">Notebook</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="link hidden" id="logoutBtn">退出</button>
</div></header>
<main id="app"><div class="empty">加载中…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mjsgcvuyousczqexxszs.supabase.co";
const SUPABASE_KEY = "sb_publishable_WEmGQIZnbWUMSXm9oKSWdQ_l7tDrIIE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storageKey: "notebook-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const $app = document.getElementById("app");
const state = { user: null, isMember: false, names: {}, members: [] };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const x = new Date(d); return `${x.getFullYear()}.${x.getMonth()+1}.${x.getDate()}`; };
const fmtTime = d => { const x = new Date(d); return `${fmtDate(d)} ${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`; };
const cn = n => { const d="零一二三四五六七八九"; if(n<10) return d[n]; if(n<20) return "十"+(n%10?d[n%10]:""); if(n<100) return d[Math.floor(n/10)]+"十"+(n%10?d[n%10]:""); return String(n); };
const prose = t => { const ps = String(t||"").split(/\n+/).map(s=>s.trim()).filter(Boolean); return ps.length ? ps.map(p=>`<p>${esc(p)}</p>`).join("") : `<p class="empty">（还没有内容）</p>`; };
const countChars = t => String(t||"").replace(/\s/g,"").length;
const store = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} }, del(k){ try{localStorage.removeItem(k)}catch{} } };
function setMsg(el, text, err){ el.textContent = text||""; el.classList.toggle("err", !!err); }
function nameOf(id){ return state.names[id] || "?"; }

/* ---------- auth ---------- */
async function refreshSession(){
  const { data:{ session } } = await sb.auth.getSession();
  state.user = session?.user && !session.user.is_anonymous ? session.user : null;
  state.isMember = false;
  if (state.user){
    const { data } = await sb.rpc("is_book_member");
    state.isMember = !!data;
    if (state.isMember){
      const { data: ms } = await sb.from("book_members").select("user_id,display_name,created_at").order("created_at");
      state.members = ms || [];
      state.names = Object.fromEntries(state.members.map(m=>[m.user_id, m.display_name]));
    }
  }
  document.getElementById("who").textContent = state.user ? (state.names[state.user.id] || state.user.email) : "";
  document.getElementById("logoutBtn").classList.toggle("hidden", !state.user);
}
document.getElementById("logoutBtn").onclick = async () => { await sb.auth.signOut(); location.hash = "#/"; await boot(); };

function viewAuth(){
  $app.innerHTML = `
  <div class="card" style="max-width:420px;margin:40px auto">
    <h1>Notebook</h1>
    <p class="sub">私人写作空间 · 仅限成员</p>
    <div class="tabs"><button class="on" data-t="in">登录</button><button data-t="up">注册</button></div>
    <form id="authForm">
      <div id="nameWrap" class="hidden"><label>你在这里的名字</label><input id="dname" maxlength="40" placeholder="例如：小雨"></div>
      <label>邮箱</label><input id="email" type="email" required autocomplete="email">
      <label>密码</label><input id="pw" type="password" required minlength="8" autocomplete="current-password">
      <div class="row" style="margin-top:20px"><button id="go" type="submit">登录</button>
        <button type="button" class="link" id="forgot">忘记密码</button></div>
      <div class="msg" id="msg"></div>
    </form>
  </div>`;
  let mode = "in";
  const msg = document.getElementById("msg");
  $app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    mode = b.dataset.t;
    $app.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
    document.getElementById("nameWrap").classList.toggle("hidden", mode!=="up");
    document.getElementById("go").textContent = mode==="up" ? "注册" : "登录";
    document.getElementById("pw").autocomplete = mode==="up" ? "new-password" : "current-password";
    setMsg(msg,"");
  });
  document.getElementById("forgot").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    if(!email) return setMsg(msg,"先填邮箱", true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + "#/reset" });
    setMsg(msg, error ? error.message : "重置邮件已发送，请查收邮箱", !!error);
  };
  document.getElementById("authForm").onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim(), pw = document.getElementById("pw").value;
    const go = document.getElementById("go"); go.disabled = true; setMsg(msg,"");
    try{
      if (mode==="up"){
        const name = document.getElementById("dname").value.trim();
        if(!name) throw new Error("请填写名字");
        store.set("notebook-pending-name", name);
        const { data, error } = await sb.auth.signUp({ email, password: pw, options:{ data:{ display_name:name }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session){ setMsg(msg,"注册成功！请去邮箱点确认链接，然后回来登录。"); go.disabled=false; return; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw new Error(error.message.includes("Invalid") ? "邮箱或密码不对" : error.message.includes("confirm") ? "邮箱还没确认，请先点邮件里的链接" : error.message);
      }
      await boot();
    }catch(err){ setMsg(msg, err.message, true); go.disabled=false; }
  };
}

function viewReset(){
  $app.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h1>设置新密码</h1>
    <label>新密码（至少 8 位）</label><input id="npw" type="password" minlength="8" autocomplete="new-password">
    <div class="row" style="margin-top:20px"><button id="save">保存</button></div><div class="msg" id="msg"></div></div>`;
  document.getElementById("save").onclick = async () => {
    const { error } = await sb.auth.updateUser({ password: document.getElementById("npw").value });
    if (error) return setMsg(document.getElementById("msg"), error.message, true);
    location.hash = "#/"; boot();
  };
}

async function viewPending(){
  const { data: req } = await sb.from("book_join_requests").select("*").eq("user_id", state.user.id).maybeSingle();
  const defaultName = req?.display_name || state.user.user_metadata?.display_name || store.get("notebook-pending-name") || "";
  $app.innerHTML = `<div class="card" style="max-width:460px;margin:40px auto">
    <h1>等待加入</h1>
    ${req ? `<p>已经提交申请（名字：<b>${esc(req.display_name)}</b>）。等现有成员登录后批准，你就能看到内容了。</p>
             <div class="row" style="margin-top:16px"><button class="ghost" id="recheck">刷新看看</button></div>`
          : `<p class="sub">你已登录（${esc(state.user.email)}），但还不是成员。提交申请后，由现有成员批准。</p>
             <label>你在这里的名字</label><input id="dname" maxlength="40" value="${esc(defaultName)}">
             <div class="row" style="margin-top:18px"><button id="ask">申请加入</button></div>`}
    <div class="msg" id="msg"></div></div>`;
  const msg = document.getElementById("msg");
  document.getElementById("recheck")?.addEventListener("click", boot);
  document.getElementById("ask")?.addEventListener("click", async () => {
    const name = document.getElementById("dname").value.trim();
    if(!name) return setMsg(msg,"请填写名字",true);
    const { error } = await sb.from("book_join_requests").insert({ display_name:name, email: state.user.email });
    if (error) return setMsg(msg, error.message, true);
    store.del("notebook-pending-name"); viewPending();
  });
}

/* ---------- member views ---------- */
async function viewHome(){
  const [{ data: chs, error }, { data: reqs }] = await Promise.all([
    sb.from("book_chapters").select("id,author_id,chapter_no,title,updated_at,content").order("chapter_no").order("created_at"),
    sb.from("book_join_requests").select("*").order("created_at")
  ]);
  if (error){ $app.innerHTML = `<div class="empty">加载失败：${esc(error.message)}</div>`; return; }
  const groups = {};
  (chs||[]).forEach(c => (groups[c.chapter_no] ||= []).push(c));
  const nos = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  $app.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h1>目录</h1><p class="sub" style="margin:0">${Object.keys(state.names).length} 位作者 · ${(chs||[]).length} 篇</p></div>
      <a class="btn" href="#/new">写新的一篇</a>
    </div>
    <div class="card" style="margin-top:22px"><b>成员</b> <span class="who">${state.members.length} / 3</span>
      ${state.members.map(m=>`<div class="req"><span><span class="pill">${esc(m.display_name)}</span>${m.user_id===state.user.id?` <span class="who">（你）</span>`:""}</span>
        <span class="row"><span class="who">${fmtDate(m.created_at)} 加入</span>${m.user_id===state.user.id?`<button class="link" id="rename">改名</button>`:""}</span></div>`).join("")}
      <div id="renameBox" class="hidden row" style="margin-top:12px"><input id="newName" maxlength="40" style="flex:1;min-width:160px" value="${esc(state.names[state.user.id]||"")}"><button id="saveName">保存</button></div>
      <div class="msg" id="memMsg"></div></div>
    ${reqs?.length ? `<div class="card" style="margin-top:22px"><b>加入申请</b>${reqs.map(r=>`
       <div class="req"><span>${esc(r.display_name)} <span class="who">${esc(r.email||"")}</span></span>
       <span class="row"><button class="ghost" data-ok="${r.user_id}">批准</button><button class="link" data-no="${r.user_id}">拒绝</button></span></div>`).join("")}
       <div class="msg" id="reqMsg"></div></div>` : ""}
    <div style="margin-top:28px">${nos.length ? nos.map(n=>`
      <section class="chapter"><div class="chapter-head">第${cn(n)}章</div><div class="entries">
      ${groups[n].map(c=>`<a class="entry" href="#/read/${c.id}">
        <div class="t">${esc(c.title||"无题")}</div>
        <div class="m"><span class="pill">${esc(nameOf(c.author_id))}</span>　${countChars(c.content)} 字 · 更新于 ${fmtDate(c.updated_at)}</div></a>`).join("")}
      </div></section>`).join("") : `<div class="empty">还没有内容。写下第一篇吧。</div>`}</div>`;
  document.getElementById("rename").onclick = () => document.getElementById("renameBox").classList.toggle("hidden");
  document.getElementById("saveName").onclick = async () => {
    const n = document.getElementById("newName").value.trim();
    if (!n) return setMsg(document.getElementById("memMsg"), "名字不能为空", true);
    const { error } = await sb.from("book_members").update({ display_name: n }).eq("user_id", state.user.id);
    if (error) return setMsg(document.getElementById("memMsg"), error.message, true);
    await refreshSession(); viewHome();
  };
  $app.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc("book_approve", { p_user: b.dataset.ok });
    if (error) return setMsg(document.getElementById("reqMsg"), error.message.includes("3") ? "已经有 3 位成员了" : error.message, true);
    await refreshSession(); viewHome();
  });
  $app.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => {
    if(!confirmInline(b, "确定拒绝？")) return;
    await sb.from("book_join_requests").delete().eq("user_id", b.dataset.no); viewHome();
  });
}

// two-tap confirm without browser dialogs
function confirmInline(btn, label){
  if (btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label;
  setTimeout(()=>{ delete btn.dataset.armed; btn.textContent = old; }, 3000);
  return false;
}

async function viewRead(id){
  const [{ data: c, error }, { data: coms }] = await Promise.all([
    sb.from("book_chapters").select("*").eq("id", id).maybeSingle(),
    sb.from("book_comments").select("*").eq("chapter_id", id).order("created_at")
  ]);
  if (error || !c){ $app.innerHTML = `<div class="empty">找不到这篇。<a href="#/">回目录</a></div>`; return; }
  const mine = c.author_id === state.user.id;
  $app.innerHTML = `<article>
    <div class="chapter-head">第${cn(c.chapter_no)}章</div>
    <h1>${esc(c.title||"无题")}</h1>
    <div class="meta">${esc(nameOf(c.author_id))} · ${countChars(c.content)} 字 · 更新于 ${fmtTime(c.updated_at)}
      ${mine ? `　<a href="#/edit/${c.id}">编辑</a>` : ""}</div>
    <div class="prose">${prose(c.content)}</div>
  </article>
  <section class="comments"><h2>回应</h2>
    <div id="coms"></div>
    <label>写点回应：读了这篇，你注意到了什么？</label>
    <textarea id="cbox" rows="4"></textarea>
    <div class="row" style="margin-top:10px"><button id="send">发送</button></div><div class="msg" id="cmsg"></div>
  </section>
  <p style="margin-top:40px"><a href="#/">← 回目录</a></p>`;
  let list = coms || [];
  const $coms = document.getElementById("coms");
  const byId = Object.fromEntries(list.map(m=>[m.id,m]));
  const rootOf = m => { let r = m, n = 0; while (r.parent_id && byId[r.parent_id] && n++ < 50) r = byId[r.parent_id]; return r; };
  const one = (m, isReply) => `<div class="comment${isReply?" reply":""}" data-cid="${m.id}">
      <div class="m"><span class="pill">${esc(nameOf(m.author_id))}</span>
        ${isReply && m.parent_id && byId[m.parent_id] && byId[m.parent_id].parent_id ? `<span>回复 ${esc(nameOf(byId[m.parent_id].author_id))}</span>` : ""}
        <span>${fmtTime(m.created_at)}</span>
        <button class="link" data-reply="${m.id}">回复</button>
        ${m.author_id===state.user.id?`<button class="link" data-del="${m.id}">删除</button>`:""}</div>
      <div class="c">${esc(m.content)}</div>
      <div class="reply-box hidden" data-box="${m.id}">
        <textarea rows="3" placeholder="回复 ${esc(nameOf(m.author_id))}…"></textarea>
        <div class="row" style="margin-top:8px"><button data-send="${m.id}">发送</button><button class="link" data-cancel="${m.id}">取消</button></div>
        <div class="msg"></div></div></div>`;
  function renderComments(){
    Object.keys(byId).forEach(k=>delete byId[k]); list.forEach(m=>byId[m.id]=m);
    const roots = list.filter(m => !m.parent_id || !byId[m.parent_id]);
    const kids = {}; list.filter(m => !roots.includes(m)).forEach(m => (kids[rootOf(m).id] ||= []).push(m));
    $coms.innerHTML = roots.length ? roots.map(r => `<div class="thread">${one(r,false)}${(kids[r.id]||[]).map(k=>one(k,true)).join("")}</div>`).join("")
                                   : `<p class="sub">还没有回应。</p>`;
    $coms.querySelectorAll("[data-reply]").forEach(b => b.onclick = () => {
      const box = $coms.querySelector(`[data-box="${b.dataset.reply}"]`);
      box.classList.toggle("hidden"); if (!box.classList.contains("hidden")) box.querySelector("textarea").focus();
    });
    $coms.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => $coms.querySelector(`[data-box="${b.dataset.cancel}"]`).classList.add("hidden"));
    $coms.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
      const box = $coms.querySelector(`[data-box="${b.dataset.send}"]`);
      const content = box.querySelector("textarea").value.trim(); if (!content) return;
      b.disabled = true;
      const { data, error } = await sb.from("book_comments").insert({ chapter_id:id, content, parent_id:b.dataset.send }).select().single();
      if (error){ b.disabled = false; return setMsg(box.querySelector(".msg"), error.message, true); }
      list.push(data); renderComments();
    });
    $coms.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if(!confirmInline(b,"确定删除？")) return;
      const { error } = await sb.from("book_comments").delete().eq("id", b.dataset.del);
      if (error) return;
      list = list.filter(m => m.id !== b.dataset.del).map(m => m.parent_id === b.dataset.del ? { ...m, parent_id: null } : m);
      renderComments();
    });
  }
  renderComments();
  const ckey = "notebook-comment-" + id;
  const box = document.getElementById("cbox"); box.value = store.get(ckey) || "";
  box.oninput = () => store.set(ckey, box.value);
  document.getElementById("send").onclick = async () => {
    const content = box.value.trim(); if(!content) return;
    const { data, error } = await sb.from("book_comments").insert({ chapter_id:id, content }).select().single();
    if (error) return setMsg(document.getElementById("cmsg"), error.message, true);
    store.del(ckey); box.value = ""; list.push(data); renderComments();
  };
}

async function viewEdit(id){
  let c = { chapter_no: 1, title: "", content: "" };
  if (id){
    const { data } = await sb.from("book_chapters").select("*").eq("id", id).maybeSingle();
    if (!data || data.author_id !== state.user.id){ $app.innerHTML = `<div class="empty">只能编辑自己写的。<a href="#/">回目录</a></div>`; return; }
    c = data;
  } else {
    const { data } = await sb.from("book_chapters").select("chapter_no").eq("author_id", state.user.id).order("chapter_no",{ascending:false}).limit(1);
    c.chapter_no = (data?.[0]?.chapter_no || 0) + 1;
  }
  const dkey = "notebook-draft-" + (id || "new");
  let draft = null; try{ draft = JSON.parse(store.get(dkey)||"null"); }catch{}
  const useDraft = draft && (draft.title !== c.title || draft.content !== c.content);
  $app.innerHTML = `
    <div class="row" style="justify-content:space-between"><h1>${id ? "编辑" : "新的一篇"}</h1><span class="save-state" id="ss"></span></div>
    ${useDraft ? `<p class="msg">已恢复这台设备上未保存的草稿。<button class="link" id="discard">放弃草稿</button></p>` : ""}
    <div class="row" style="align-items:flex-end">
      <div style="width:110px"><label>第几章</label><input id="no" type="number" min="1" max="999" value="${c.chapter_no}"></div>
      <div style="flex:1;min-width:200px"><label>标题</label><input id="title" maxlength="200" value="${esc(useDraft?draft.title:c.title)}" placeholder="例如：童年的那间屋子"></div>
    </div>
    <label>正文</label>
    <textarea class="editor" id="content" placeholder="空一行分段">${esc(useDraft?draft.content:c.content)}</textarea>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <div class="row"><button id="save">保存</button><a class="btn ghost" href="${id?`#/read/${id}`:"#/"}">取消</a></div>
      ${id ? `<button class="danger" id="del">删除这篇</button>` : ""}
    </div><div class="msg" id="msg"></div>`;
  const $t = document.getElementById("title"), $c = document.getElementById("content"), $n = document.getElementById("no"), ss = document.getElementById("ss");
  const upd = () => { ss.textContent = countChars($c.value) + " 字 · 草稿已存在本机"; store.set(dkey, JSON.stringify({ title:$t.value, content:$c.value })); };
  $t.oninput = upd; $c.oninput = upd; ss.textContent = countChars($c.value) + " 字";
  document.getElementById("discard")?.addEventListener("click", () => { store.del(dkey); viewEdit(id); });
  document.getElementById("save").onclick = async () => {
    const row = { chapter_no: parseInt($n.value,10)||1, title: $t.value.trim(), content: $c.value };
    const btn = document.getElementById("save"); btn.disabled = true;
    const q = id ? sb.from("book_chapters").update(row).eq("id", id).select().single()
                 : sb.from("book_chapters").insert(row).select().single();
    const { data, error } = await q;
    if (error){ btn.disabled=false; return setMsg(document.getElementById("msg"), "保存失败：" + error.message, true); }
    store.del(dkey); location.hash = "#/read/" + data.id;
  };
  document.getElementById("del")?.addEventListener("click", async e => {
    if(!confirmInline(e.target, "再点一次确认删除")) return;
    const { error } = await sb.from("book_chapters").delete().eq("id", id);
    if (error) return setMsg(document.getElementById("msg"), error.message, true);
    store.del(dkey); location.hash = "#/";
  });
}

/* ---------- router ---------- */
async function route(){
  const h = location.hash.replace(/^#\/?/, "");
  if (h.startsWith("reset")) return viewReset();
  if (!state.user) return viewAuth();
  if (!state.isMember) return viewPending();
  const [p, id] = h.split("/");
  if (p==="read" && id) await viewRead(id);
  else if (p==="edit" && id) await viewEdit(id);
  else if (p==="new") await viewEdit(null);
  else await viewHome();
  window.scrollTo(0,0);
}
async function boot(){ await refreshSession(); await route(); }
window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange((ev) => { if (ev==="PASSWORD_RECOVERY") location.hash = "#/reset"; });
boot();
</script>
</body>
</html>
