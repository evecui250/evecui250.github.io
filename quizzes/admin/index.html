<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>发码助手</title>
<style>
  :root{--bg:#faf6f1;--card:#fff;--ink:#2b2522;--muted:#8a7f78;--line:#ece4dc;--accent:#b4535b;--soft:#f6e3e2;--good:#5d8a6a;--mid:#c79a3e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:8px 0 16px}
  button{font:inherit;cursor:pointer;border:none}
  input{font:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
  .in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;margin-bottom:10px}
  .in:focus{outline:none;border-color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12.5px;color:var(--muted)}
  .issued{display:none;margin-top:14px;padding:14px;border-radius:12px;background:var(--soft);text-align:center}
  .issued .code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:2px;margin:4px 0 12px;user-select:all}
  .row2{display:flex;gap:8px}
  .row2 .btn{flex:1}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{padding:6px 12px;border-radius:20px;background:#efeae4;color:var(--muted);font-size:14px}
  .tab.on{background:var(--ink);color:#fff}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .item .c{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600}
  .item .meta{font-size:12.5px;color:var(--muted)}
  .item .note{font-size:13.5px;color:var(--ink);cursor:pointer}
  .item .note.empty{color:#c2b8b0}
  .badge{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .b-used{background:#e3efe6;color:var(--good)}
  .b-wait{background:#f6eedb;color:var(--mid)}
  .b-new{background:#efeae4;color:var(--muted)}
  .grow{flex:1;min-width:0}
  .act{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .link{background:none;color:var(--accent);font-size:13px;padding:2px 0}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:.92}
  .hidden{display:none!important}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>发码助手</h1>

  <!-- 登录 -->
  <div id="login" class="card">
    <p class="muted" style="margin-top:0">输入管理密码（只需输入一次，这台手机会记住）</p>
    <input id="pw" class="in" type="password" placeholder="管理密码" autocomplete="current-password">
    <button class="btn" id="loginBtn">进入</button>
    <p id="loginMsg" class="muted" style="color:var(--accent)"></p>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:16px">通用兑换码（所有买家用同一个，不限次数）</h3>
      <p class="muted" style="margin-top:0">家人码 JIAREN-HH8D 不受换码影响。</p>
      <select id="shQuiz" class="in" style="margin-bottom:10px">
        <option value="stage">16型人格 · 成长阶段（/jieduan/）</option>
        <option value="single">适合结婚，还是一个人？（/single/）</option>
        <option value="marry">该结婚还是分手？（/marry/）</option>
      </select>
      <div id="shNow" class="muted" style="margin-bottom:10px">加载中…</div>
      <input id="shNew" class="in" placeholder="新码（可留空，自动生成）" autocapitalize="characters">
      <button class="btn ghost" id="shRotate">换一个新的通用码</button>
      <p class="muted" style="margin-bottom:0">换码后旧码立刻失效，已经用旧码解锁过的手机不受影响。记得同时更新自动发货里的话术。</p>
    </div>
    <div class="hidden" id="oneTimeSec">
    <h3 style="margin:18px 0 10px;font-size:16px">一次性兑换码 · 该结婚还是分手？</h3>
    <div class="stats">
      <div class="stat"><b id="sLeft">–</b><span>还没发出</span></div>
      <div class="stat"><b id="sWait">–</b><span>已发出·待使用</span></div>
      <div class="stat"><b id="sUsed">–</b><span>客户已使用</span></div>
    </div>

    <div class="card">
      <input id="note" class="in" placeholder="客户备注（可选，比如小红书昵称/订单号）">
      <button class="btn" id="issueBtn">发一个新码</button>
      <div class="issued" id="issued">
        <div class="muted">新兑换码</div>
        <div class="code" id="newCode"></div>
        <div class="row2">
          <button class="btn sm" id="copyMsg">复制发货话术</button>
          <button class="btn sm ghost" id="copyCode">只复制码</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="issued">已发出</button>
        <button class="tab" data-f="used">已使用</button>
        <button class="tab" data-f="wait">待使用</button>
        <button class="tab" data-f="shared">家人码</button>
        <button class="tab" data-f="new">未发出</button>
      </div>
      <div id="list"></div>
      <div class="tools">
        <button class="btn sm ghost" id="refresh">刷新</button>
        <button class="btn sm ghost" id="exportBtn">导出表格</button>
        <button class="btn sm ghost" id="addBtn">补充 50 个码</button>
        <button class="btn sm ghost" id="logout">退出登录</button>
      </div>
    </div>
    <p class="muted">“已使用”表示客户已经用这个码在手机上解锁了测试。点备注可以修改；发错了的码，只要还没被使用，就可以“撤回”放回去。</p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://mjsgcvuyousczqexxszs.supabase.co";
const SB_KEY="sb_publishable_WEmGQIZnbWUMSXm9oKSWdQ_l7tDrIIE";
const QUIZ_URL="https://test.spelloapp.com/marry/";
const PW_KEY="quiz-admin-pw";
const $=id=>document.getElementById(id);
let PW="", rows=[], filter="issued";

function msgFor(code){
  return `你好～这是你的测试链接和兑换码：\n\n链接：${QUIZ_URL}\n兑换码：${code}\n\n请复制链接到手机浏览器（Safari / Chrome 等）打开，输入兑换码就可以开始，大约 7 分钟。同一台手机之后可以重复进入、查看结果～`;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600);}
async function copy(t){
  try{await navigator.clipboard.writeText(t);}catch(e){
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  toast("已复制");
}
async function rpc(fn,args){
  const opts={method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify({p_secret:PW,...args})};
  let r; try{ r=await fetch(`/api/rpc/${fn}`,opts); if(r.status===404||r.status===405) throw 0; }catch(e){ r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,opts); }
  const txt=await r.text();
  if(!r.ok){ if(txt.includes("unauthorized")) throw new Error("unauthorized"); throw new Error(txt||("HTTP "+r.status)); }
  return txt?JSON.parse(txt):null;
}
const fmt=t=>{if(!t)return"";const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  rows = await rpc("admin_list",{});
  const singles=rows.filter(r=>r.kind==="single");
  $("sLeft").textContent=singles.filter(r=>!r.issued_at&&r.devices_used==0).length;
  $("sWait").textContent=singles.filter(r=>r.issued_at&&r.devices_used==0).length;
  $("sUsed").textContent=singles.filter(r=>r.devices_used>0).length;
  render();
}
function render(){
  let list=rows;
  if(filter==="issued") list=rows.filter(r=>r.kind==="single"&&(r.issued_at||r.devices_used>0));
  if(filter==="used") list=rows.filter(r=>r.kind==="single"&&r.devices_used>0);
  if(filter==="wait") list=rows.filter(r=>r.kind==="single"&&r.issued_at&&r.devices_used==0);
  if(filter==="shared") list=rows.filter(r=>r.kind==="shared");
  if(filter==="new") list=rows.filter(r=>r.kind==="single"&&!r.issued_at&&r.devices_used==0);
  if(!list.length){$("list").innerHTML=`<p class="muted">这里还没有</p>`;return;}
  $("list").innerHTML=list.slice(0,300).map(r=>{
    const used=r.devices_used>0;
    const badge = r.kind==="shared" ? `<span class="badge b-used">${r.devices_used}/${r.max_devices} 台</span>`
      : used ? `<span class="badge b-used">已使用</span>` : r.issued_at ? `<span class="badge b-wait">待使用</span>` : `<span class="badge b-new">未发出</span>`;
    const meta=[r.issued_at?`发出 ${fmt(r.issued_at)}`:"", used?`使用 ${fmt(r.first_used_at)}`:"", r.kind==="shared"?(r.note||""):""].filter(Boolean).join(" · ");
    return `<div class="item">
      <div class="grow">
        <div class="c">${esc(r.code)}</div>
        ${r.kind==="single"?`<div class="note ${r.issued_note?"":"empty"}" data-note="${esc(r.code)}">${r.issued_note?esc(r.issued_note):"+ 添加备注"}</div>`:""}
        <div class="meta">${esc(meta)}</div>
      </div>
      <div class="act">${badge}
        <button class="link" data-copy="${esc(r.code)}">复制话术</button>
        ${r.kind==="single"&&r.issued_at&&!used?`<button class="link" data-un="${esc(r.code)}">撤回</button>`:""}
      </div></div>`;
  }).join("");
}

$("list").onclick=async e=>{
  const t=e.target;
  if(t.dataset.copy) copy(msgFor(t.dataset.copy));
  if(t.dataset.note!==undefined){
    const r=rows.find(x=>x.code===t.dataset.note); const v=prompt("客户备注",r.issued_note||""); if(v===null) return;
    await rpc("admin_set_note",{p_code:r.code,p_note:v}); r.issued_note=v.trim()||null; render(); toast("已保存");
  }
  if(t.dataset.un){
    if(!confirm(`撤回 ${t.dataset.un}？它会回到“未发出”。`)) return;
    await rpc("admin_unissue",{p_code:t.dataset.un}); await load(); toast("已撤回");
  }
};
$("tabs").onclick=e=>{ if(!e.target.dataset.f) return; filter=e.target.dataset.f; [...$("tabs").children].forEach(b=>b.classList.toggle("on",b===e.target)); render(); };

$("issueBtn").onclick=async()=>{
  const b=$("issueBtn"); b.disabled=true; b.textContent="发码中…";
  try{
    const code=await rpc("admin_issue_code",{p_note:$("note").value});
    if(!code){ toast("没有可发的码了，点下面“补充 50 个码”"); return; }
    $("newCode").textContent=code; $("issued").style.display="block"; $("note").value="";
    await copy(msgFor(code)); toast("已发出，话术已复制");
    load();
  }catch(e){ toast("出错了："+e.message); }
  finally{ b.disabled=false; b.textContent="发一个新码"; }
};
$("copyMsg").onclick=()=>copy(msgFor($("newCode").textContent));
$("copyCode").onclick=()=>copy($("newCode").textContent);
$("refresh").onclick=()=>load().then(()=>toast("已刷新"));
$("addBtn").onclick=async()=>{ if(!confirm("再生成 50 个新兑换码？")) return; const n=await rpc("admin_add_codes",{p_n:50}); await load(); toast(`已补充 ${n} 个`); };
$("exportBtn").onclick=()=>{
  const head=["兑换码","类型","客户备注","发出时间","使用设备数","首次使用时间"];
  const lines=[head,...rows.map(r=>[r.code,r.kind==="shared"?"家人通用码":"一次性",r.issued_note||"",r.issued_at?new Date(r.issued_at).toLocaleString():"",r.devices_used,r.first_used_at?new Date(r.first_used_at).toLocaleString():""])];
  const csv="﻿"+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`兑换码_${new Date().toISOString().slice(0,10)}.csv`; a.click();
};
async function loadShared(){
  const q=$("shQuiz").value; const list=await rpc("admin_list",{p_quiz:q});
  const cur=list.filter(r=>r.kind==="shared"&&r.active&&(r.note||"").startsWith("通用"));
  $("shNow").innerHTML = cur.length ? cur.map(r=>`当前通用码：<b style="font-size:18px;font-family:ui-monospace,Menlo,monospace;user-select:all">${esc(r.code)}</b>　已有 ${r.devices_used} 台手机使用`).join("<br>") : "这个测试还没有通用码";
}
$("shQuiz").onchange=()=>loadShared();
$("shRotate").onclick=async()=>{
  const q=$("shQuiz").value; const want=$("shNew").value.trim();
  if(!confirm(`确定要换新的通用码吗？旧码会立刻失效。`)) return;
  try{ const code=await rpc("admin_rotate_shared",{p_quiz:q,p_code:want||null}); $("shNew").value=""; await loadShared(); copy(code); toast("新码 "+code+" 已复制"); }
  catch(e){ toast(e.message.includes("code exists")?"这个码已经存在，换一个":"出错了："+e.message); }
};
$("logout").onclick=()=>{ try{localStorage.removeItem(PW_KEY);}catch(e){} location.reload(); };

async function tryLogin(pw,silent){
  PW=pw;
  try{ await load(); loadShared(); try{localStorage.setItem(PW_KEY,pw);}catch(e){} $("login").classList.add("hidden"); $("main").classList.remove("hidden"); }
  catch(e){ PW=""; if(!silent) $("loginMsg").textContent = e.message==="unauthorized"?"密码不对":"连接失败，请稍后再试"; }
}
$("loginBtn").onclick=()=>tryLogin($("pw").value.trim());
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click();});
(function(){ let p=null; try{p=localStorage.getItem(PW_KEY);}catch(e){} if(p) tryLogin(p,true); })();
</script>
</body>
</html>
