<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16型人格 · 成长阶段测试</title>
<meta name="description" content="从三观、现实、相处、家庭、感情、人品、自己七个维度，看清你们这段关系。">
<style>
  :root{
    --bg:#faf6f1; --card:#ffffff; --ink:#2b2522; --muted:#8a7f78; --line:#ece4dc;
    --accent:#b4535b; --accent-soft:#f6e3e2; --good:#5d8a6a; --mid:#c79a3e; --bad:#b4535b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif}
  h1{font-size:34px;line-height:1.25;margin:48px 0 12px;letter-spacing:1px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 28px}
  .pie{width:100%;max-width:340px;margin:4px auto 28px;aspect-ratio:1}
  .pie svg{width:100%;height:100%;display:block;overflow:visible}
  .pie .seg{transform-origin:170px 170px;animation:pop .6s cubic-bezier(.2,.8,.3,1.2) both}
  .pie .lbl{font-size:14px;font-weight:600;fill:#fff;letter-spacing:1px;pointer-events:none}
  .pie .ctr1{font-size:19px;font-weight:600;fill:#6b605a;letter-spacing:3px}
  .pie .ctr2{font-size:12px;fill:var(--muted);letter-spacing:1px}
  @keyframes pop{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
  .modules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 28px}
  .modules div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
  .modules b{display:block;font-size:15px;margin-bottom:2px}
  .modules span{color:var(--muted);font-size:12.5px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px}
  button{font:inherit;cursor:pointer;border:none}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;letter-spacing:1px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:12px}
  .hidden{display:none!important}

  /* quiz */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .link{background:none;color:var(--muted);font-size:14px;padding:6px 0}
  .link:disabled{opacity:.3}
  .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .mod{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:8px}
  .q{font-size:21px;font-weight:600;line-height:1.45;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s}
  .opt.na{color:var(--muted);border-style:dashed}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  @media (hover:hover){.opt:hover{border-color:#c9c2e3}}

  /* result */
  #card{background:var(--bg);padding:4px 2px 2px}
  .r-head{text-align:center;margin:20px 0 8px}
  .r-title{font-size:15px;color:var(--accent);letter-spacing:2px;margin-bottom:14px}
  .r-label{font-size:13px;color:var(--muted);letter-spacing:2px}
  .score{font-size:72px;font-weight:700;line-height:1.1;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .score small{font-size:20px;color:var(--muted);font-weight:500}
  .verdict{font-size:24px;font-weight:700;margin:10px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
  .card h3{margin:0 0 12px;font-size:16px}
  .card p{margin:0 0 10px;font-size:15.5px}
  .card p:last-child{margin-bottom:0}
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
  .row-top b{font-variant-numeric:tabular-nums}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px}
  .row-note{font-size:13.5px;color:var(--muted);margin-top:5px}
  .flag{border-color:#e7b9b5;background:#fdf1f0}
  .flag h3{color:var(--bad)}
  .flag li{margin-bottom:4px}
  ul{margin:0;padding-left:20px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{background:var(--accent-soft);color:var(--accent);font-size:13.5px;padding:4px 10px;border-radius:20px}
  .tags.gray span{background:#efeae4;color:var(--muted)}
  .brand{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:1px}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 保存图片弹层 */
  .overlay{position:fixed;inset:0;background:rgba(30,24,22,.95);z-index:10;display:flex;flex-direction:column}
  .ov-top{flex:none;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;text-align:center;color:#fff}
  .ov-top b{display:block;font-size:18px;margin-bottom:2px}
  .ov-top span{font-size:13.5px;opacity:.8}
  .ov-img{flex:1;overflow:auto;padding:0 16px;display:flex;justify-content:center}
  .ov-img img{width:100%;max-width:420px;height:auto;align-self:flex-start;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.35);-webkit-touch-callout:default}
  .ov-bar{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:452px;width:100%;margin:0 auto}
  .ov-bar button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
  .ov-save{background:var(--accent);color:#fff}
  .ov-close{background:rgba(255,255,255,.15);color:#fff}
  .legal-link{display:block;margin:22px auto 0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
  .legal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom))}
  .legal-in{max-width:560px;margin:0 auto}
  .legal h2{font-size:20px;margin:8px 0 16px}
  .legal h4{font-size:15px;margin:18px 0 6px}
  .legal p{font-size:14px;color:#4a413c;margin:0 0 8px}
  .gate{margin-bottom:4px}
  .code-input{display:block;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:18px;letter-spacing:2px;text-align:center;background:var(--card);color:var(--ink);margin-bottom:12px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .code-input:focus{outline:none;border-color:var(--accent)}
  .gate-msg{min-height:20px;font-size:14px;color:var(--bad);text-align:center;margin:10px 0 0}
  .gate-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
  :root{--teal:#5f8f8f}
  .verdict.big{font-size:32px;margin-top:6px}
  .spectrum{margin:18px 4px 4px}
  .spec-bar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#5f8f8f,#c9a85a 50%,#b4535b)}
  .spec-bar i{position:absolute;top:50%;width:22px;height:22px;margin-left:-11px;margin-top:-11px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .spec-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .spec-num{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}
  .card.soft{background:#f6f1e8}
  :root{--bg:#f2f4f0;--accent:#4f8584;--accent-soft:#e1ecea;--rose:#b4535b;--line:#e2e6df}
  .hero{max-width:320px;margin:30px auto 0}
  .hero svg{width:100%;display:block}
  .hero .hl{font-size:13px;fill:#8a7f78;letter-spacing:2px}
  .hero .dot{animation:swing 3.2s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
  .center{text-align:center}
  h1.center{margin-top:22px}
  h1 em{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 26px}
  .chips span{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:14px;color:#4a413c;animation:fade .4s ease both}
  .note{text-align:center}
  .q.stmt{font-size:20px;margin:18px 0 34px;min-height:90px}
  .likert{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:stretch;gap:4px}
  .lk{flex:1;background:none;display:grid;grid-template-rows:56px auto;justify-items:center;align-items:center;row-gap:6px;padding:4px 0}
  .lk i{display:block;border-radius:50%;border:2.5px solid;transition:background .15s,transform .15s}
  .lk span{font-size:12px;color:var(--muted);white-space:nowrap}
  .lk0 i{width:50px;height:50px;border-color:#5a4e9c}
  .lk1 i{width:40px;height:40px;border-color:#8a80c0}
  .lk2 i{width:32px;height:32px;border-color:#b5ada6}
  .lk3 i{width:40px;height:40px;border-color:#a9a3b8}
  .lk4 i{width:50px;height:50px;border-color:#8c8698}
  .lk0.sel i{background:#5a4e9c} .lk1.sel i{background:#8a80c0} .lk2.sel i{background:#b5ada6} .lk3.sel i{background:#a9a3b8} .lk4.sel i{background:#8c8698}
  .lk.sel span{color:var(--ink);font-weight:600}
  .lk:active i{transform:scale(.92)}
  @media (hover:hover){.lk:hover i{transform:scale(1.06)}}
  /* 分享图专用排版：固定宽度、两侧留白、大标题 */
  .share-img{position:fixed;left:-9999px;top:0;width:420px;padding:36px 30px 30px;background:var(--bg)}
  .share-img .r-head{margin:0 0 6px}
  .share-img .r-title{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-bottom:10px;line-height:1.35}
  .share-img .r-label{font-size:13px}
  .share-img .verdict{font-size:30px}
  .share-img .verdict.big{font-size:36px}
  .share-img .score{font-size:80px}
  .share-img .card{padding:18px 18px;margin-top:16px}
  .share-img .card p{font-size:15px}
  .share-img .brand{font-size:14px;margin-top:22px;color:var(--ink);letter-spacing:1px}
  :root{--bg:#f5f3f9;--accent:#6b5fa8;--accent-soft:#e8e4f4;--line:#e4e0ee;--t-light:#c9c2e3;--t-mid:#9a8fc4;--t-dark:#3f3577}
  body{transition:background .3s}
  .hero .sl{font-size:13px;fill:#4a413c;letter-spacing:2px;font-weight:600}
  .hero .sl.w{fill:#fff}
  .hero .climb{animation:climb 4.5s ease-in-out infinite}
  @keyframes climb{0%,15%{transform:translate(0,0)}35%,50%{transform:translate(90px,-32px)}70%,85%{transform:translate(180px,-66px)}100%{transform:translate(0,0)}}
  .pick-h{font-size:24px;margin:16px 0 6px}
  .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tp{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tp b{font-size:15px;letter-spacing:.5px}
  .tp span{font-size:11px;color:var(--muted)}
  .tp.g0 b{color:#6b5fa8} .tp.g1 b{color:#4f8a6e} .tp.g2 b{color:#4a6fa5} .tp.g3 b{color:#b07a3a}
  .tp:active{transform:scale(.96)}
  .stairs{margin:18px 4px 4px}
  .st-track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
  .st-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--t-light),var(--accent),var(--t-dark))}
  .st-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .st-labels span.on{color:var(--accent);font-weight:700}
  .muted-p{color:var(--muted);font-size:14.5px!important}
  .persona{font-size:20px;color:var(--ink);margin-top:8px;letter-spacing:1px}
  .pts{margin:0;padding-left:18px}
  .pts li{font-size:15.5px;margin-bottom:10px;line-height:1.6}
  .pts li:last-child{margin-bottom:0}
  .duo h4{margin:0 0 4px;font-size:14px;color:var(--accent)}
  .duo p{font-size:15px}
  .duo div+div{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .share-img .persona{font-size:22px}
  .fnstack{display:flex;gap:8px;margin:0 0 12px!important}
  .fn{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--accent-soft);font-weight:700;color:var(--accent);font-size:15px}
  .fn em{display:block;font-style:normal;font-size:20px;font-weight:700;line-height:1.3;margin-top:2px}
  .fn small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
  .fn.inf{background:var(--accent);color:#fff} .fn.inf small{color:#ffffffcc}
  .avatar{display:block;height:230px;max-width:80%;object-fit:contain;margin:14px auto 2px}
  .share-img .avatar{height:250px}
  .fnbars{display:flex;gap:12px;align-items:flex-end;margin:6px 0 14px}
  .fb{flex:1;text-align:center}
  .fb b{display:block;font-size:18px;color:var(--accent);margin-bottom:6px}
  .fb.inf b{color:var(--t-dark)} .fb.dom b{font-size:13px;font-weight:600;color:var(--t-mid)}
  .fb-track{height:100px;border-radius:14px;background:var(--bg);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .fb-track i{position:absolute;left:5px;right:5px;bottom:5px;border-radius:10px;background:linear-gradient(180deg,var(--t-mid),var(--accent))}
  .fb.dom .fb-track i{background:linear-gradient(180deg,var(--accent-soft),var(--t-light));height:calc(100% - 10px)!important}
  .fb.inf .fb-track i{background:linear-gradient(180deg,var(--accent),var(--t-dark))}
  .fb span{display:block;font-weight:700;color:var(--ink,#2b2b2b);margin-top:8px;font-size:15px}
  .fb small{display:block;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="intro" class="fade">
    <div class="hero">
      <svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="30" y="110" width="80" height="34" rx="6" fill="#c9c2e3"/>
        <rect x="120" y="78" width="80" height="66" rx="6" fill="#9a8fc4"/>
        <rect x="210" y="44" width="80" height="100" rx="6" fill="#6b5fa8"/>
        <text x="70" y="132" text-anchor="middle" class="sl">初阶</text>
        <text x="160" y="116" text-anchor="middle" class="sl w">中阶</text>
        <text x="250" y="98" text-anchor="middle" class="sl w">高阶</text>
        <circle class="climb" cx="70" cy="98" r="9" fill="#2b2522"/>
      </svg>
    </div>
    <h1 class="serif center">你的人格，<br>修炼到<em>第几阶</em>了？</h1>
    <p class="lead center">同一个类型，也有不同的成长状态。<br>看看你现在走到了哪里。</p>
    <div class="chips" id="pie"></div>
    <div class="note">先选你的类型，再答 38 道题，约 7 分钟。<br>部分题目会根据你类型的认知功能定制。<br>凭真实情况选，“完美答案”反而会被识破哦。</div>
    <div id="gate" class="gate hidden">
      <input id="codeInput" class="code-input" placeholder="输入兑换码" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="redeemBtn">验证并开始</button>
      <p class="gate-msg" id="gateMsg"></p>
      <p class="gate-hint">还没有兑换码？联系微信 <b style="user-select:all">ismeeeve</b> 获取</p>
    </div>
    <button class="btn" id="startBtn">开始测试</button>
    <button class="btn ghost hidden" id="resumeBtn">继续上次的进度</button>
    <button class="btn ghost hidden" id="lastBtn">查看上次的结果</button>
    <button class="legal-link" onclick="showLegal()">使用说明 · 隐私 · 免责声明</button>
  </section>

  <!-- 选类型 -->
  <section id="pick" class="hidden">
    <div class="top"><button class="link" onclick="goHome()">‹ 首页</button></div>
    <h2 class="serif pick-h">先选你的类型</h2>
    <p class="lead" style="margin-bottom:16px">之前测过的结果就好，四个字母。</p>
    <div class="type-grid" id="typeGrid"></div>
    <button class="btn ghost" style="margin-top:16px" onclick="beginWith(null)">我不确定自己的类型（会多 8 道题帮你估计）</button>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="hidden">
    <div class="top">
      <button class="link" id="backBtn">‹ 上一题</button>
      <button class="link" id="homeBtn1">首页</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="qbox"></div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="hidden"></section>

</div>

<script>
// ---------- 题库 ----------
// 计分思路：每句话代表某个阶段的典型状态（L=初阶，M=中阶，H=高阶），
// 你越认同哪些句子，结果就越靠近那个阶段。这样可以表达“初阶和高阶都乐观，中阶反而悲观”这类情况。
// 情境题的每个选项直接对应一个阶段（1=初阶，2=中阶，3=高阶）。
const LIKERT = ["很符合","比较符合","一般","不太符合","很不符合"];
const L = (q,m,extra={})=>({kind:"likert",q,m,...extra});
const C = (q,opts)=>({kind:"choice",q,o:opts});

const SHARED = [
  { name:"了解自己", key:"aware", qs:[
    L("我能说出自己在关系里反复出现的模式","H"),
    L("我很少需要反省，因为我做事一般没什么问题","L"),
    L("想弄清楚自己的时候，我常常越想越乱","M"),
    L("我想得很多，但很少真正去做","M"),
  ]},
  { name:"管理情绪", key:"emotion", qs:[
    L("生气的时候，我能先停一下，再决定怎么回应","H"),
    L("我常常把情绪憋着，直到某天突然爆发","L"),
    L("焦虑的时候，我通常知道自己在焦虑什么","H"),
    L("我常常被焦虑困住，脑子停不下来","M"),
    C("心情低落了一段时间，你通常会？",[
      ["刷手机、吃东西，等它自己过去",1],["一个人反复想，越想越沉",2],["找信任的人聊聊",2.5],["看情况：小事自己调节，大事找人聊或找专业帮助",3]]),
  ]},
  { name:"看待生活", key:"view", qs:[
    L("我相信事情总会好起来，不太去想太深","L"),
    L("我常常觉得很多事情没什么意义","M",{care:true}),
    L("我见过生活的难，但依然愿意热爱它","H"),
    C("下雪天，看到维修工人在寒风里修路灯，你心里想的是？",[
      ["好冷，赶紧回家",1],["心疼他，觉得世界有点不公平",2],["有点感动，有人在默默守护这座城市",3]]),
  ]},
  { name:"对待他人", key:"open", qs:[

function toOptions(item){
  if(item.kind==="likert"){
    if(item.m==="lie") return LIKERT.map((l,a)=>[l,null,(a<=1?"lie":null),"skip"]);
    return LIKERT.map((l,a)=>[l,a]);     // 存认同程度，计分时再换算
  }
  return item.o;
}
function buildModules(type){
  const isI = type && type[0]==="I";
  const SOLO = isI ? L("我能主动走进人群，和不太熟的人也聊得自在","H")
                   : L("我能一个人过好几天（比如独自旅行），而且过得很自在","H");
  const mods = SHARED.map(m=>({name:m.name,key:m.key,qs:m.qs.map(q=>q==="SOLO"?SOLO:q)}));
  let bal;
  if(type && STACKS[type]){
    const [, aux, ter, inf] = STACKS[type];   // 辅助 2 道 + 第三 2 道 + 劣势 4 道（劣势功能是成长的关键）
    bal = [...FN_ITEMS[aux].slice(0,2).map(q=>L(q,"H",{fn:aux,role:"aux"})),
           ...FN_ITEMS[ter].slice(0,2).map(q=>L(q,"H",{fn:ter,role:"ter"})),
           ...FN_ITEMS[inf].map(q=>L(q,"H",{fn:inf,role:"inf"}))];
  } else bal = BALANCE.X.map(q=>L(q,"H"));
  mods.push({name:"补足短板", key:"balance", qs:bal});
  mods.push({name:"测谎", key:"lie", hidden:true, qs:LIE});
  if(!(type && type.length===4)) mods.push({name:"类型", key:"type", hidden:true, qs:TYPE_QS});
  return mods.map(m=>({name:m.name,key:m.key,hidden:!!m.hidden,qs:m.qs.map(it=>({...it,o: it.axis? it.o : toOptions(it)}))}));
}

// 把一道题的作答换算成“阶段估计值”（1=初阶 … 3=高阶）和权重
const AGREE = [1, .75, .5, .25, 0];             // 很符合 … 很不符合
const ALT = {H:1.6, L:2.4, M:2.2};               // 不认同这句话时，大概说明你在哪
const MV = {L:1, M:2, H:3};
function itemEstimate(q, a){
  if(q.kind==="likert"){
    if(q.m==="lie") return null;
    const g=AGREE[a], v = g*MV[q.m] + (1-g)*ALT[q.m];
    let w = 0.5 + Math.abs(g-0.5);               // 越确定，权重越大
    if(q.m==="M") w*=0.8;
    return {v,w};
  }
  const o=q.o[a]; if(!o || o[1]==null) return null;
  return {v:o[1], w:1.2};
}

function makeOrder(){
  const heavy = new Set(QUESTIONS.map((q,i)=>q.o.some(o=>o[2])?i:-1).filter(i=>i>=0));

  do{

    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}

  return a;
}

  QUESTIONS.forEach((q,i)=>{
    const a=answers[i]; const o=q.o[a];
    if(o && o[2]==="lie") lie++;
    if(q.care && a===0) care=true;
    const e=itemEstimate(q,a); if(!e) return;
    mods[q.mi].sv+=e.v*e.w; mods[q.mi].sw+=e.w; SV+=e.v*e.w; SW+=e.w;
  });
  const to100 = v => Math.round(Math.max(0,Math.min(100,(v-1)/2*100)));
  const modScores=mods.map(m=>m.sw?to100(m.sv/m.sw):null);
  const roles={};
  QUESTIONS.forEach((q,i)=>{ if(!q.role) return; const e=itemEstimate(q,answers[i]); if(!e) return;
    const r=roles[q.role]||(roles[q.role]={sv:0,sw:0}); r.sv+=e.v*e.w; r.sw+=e.w; });
  const roleScores={}; for(const k in roles) roleScores[k]=to100(roles[k].sv/roles[k].sw);
  return {modScores,total:SW?to100(SV/SW):0,lie,care,roleScores};
}

// ---------- 保存图片 ----------
let h2cLoading=null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cLoading) h2cLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src="html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return h2cLoading;
}
async function saveImage(){
  const btn=$("saveBtn"); const old=btn.textContent;
  btn.textContent="生成中…"; btn.disabled=true;
  try{
    await loadH2C();
    const holder=document.createElement("div"); holder.className="share-img";
    holder.appendChild($("card").cloneNode(true)); holder.firstChild.removeAttribute("id");
    holder.querySelectorAll(".no-img").forEach(e=>e.remove());
    document.body.appendChild(holder);
    const bg=getComputedStyle(document.body).backgroundColor;
    let canvas;
    try{ canvas = await html2canvas(holder,{backgroundColor:bg,scale:2.5,useCORS:true,windowWidth:420,x:0,y:0}); }
    finally{ holder.remove(); }
    const url = canvas.toDataURL("image/jpeg",0.92);
    const blob = await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.92));
    const file = blob && new File([blob],"16型人格成长阶段-结果.jpg",{type:"image/jpeg"});
    const inApp = /MicroMessenger|xhsdiscover|XiaoHongShu|Weibo|QQ\/|DingTalk|aweme|Lark/i.test(navigator.userAgent);
    const desktop = window.matchMedia("(hover:hover)").matches;
    const canShare = !desktop && file && navigator.canShare && navigator.canShare({files:[file]});

    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`
      <div class="ov-top">
        <b>${desktop?"图片已下载":canShare?"点下方按钮保存到相册":"长按图片 → 保存图片"}</b>
        <span>${desktop?"在下载文件夹里可以找到":canShare?"在弹出的菜单里选「存储图像」或「保存图片」":inApp?"长按没反应的话：点右上角「…」选择在浏览器打开，或者直接截图":"图片还没有保存，记得长按哦；不行的话直接截图也可以"}</span>
      </div>
      <div class="ov-img"><img src="${url}" alt="测试结果"></div>
      <div class="ov-bar">
        ${canShare?`<button class="ov-save">保存到相册</button>`:""}
        <button class="ov-close">${canShare?"关闭":"我保存好了"}</button>
      </div>`;
    ov.querySelector(".ov-close").onclick=()=>ov.remove();
    const sv=ov.querySelector(".ov-save");
    if(sv) sv.onclick=async()=>{
      try{ await navigator.share({files:[file]}); sv.textContent="已保存 ✓"; }
      catch(e){ if(e && e.name!=="AbortError") ov.querySelector(".ov-top span").textContent="没成功的话，长按图片也可以保存"; }
    };
    document.body.appendChild(ov);
    if(desktop){ const a=document.createElement("a"); a.href=url; a.download="16型人格成长阶段-结果.jpg"; a.click(); }
  }catch(e){
    alert("生成图片失败，可以直接截图保存哦");
  }finally{btn.textContent=old;btn.disabled=false;}
}
