<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们会在一起吗？概率测试</title>
<meta name="description" content="TA喜欢我吗？我们有可能吗？从TA的信号、现实条件、你自己和TA的相处模式，算一算你们在一起的概率。">
<style>
  :root{
    --bg:#fdf6f5; --card:#ffffff; --ink:#2e2426; --muted:#8f7f82; --line:#f1e1e2;
    --accent:#d0657a; --accent-soft:#fbe6ea; --good:#d0657a; --mid:#d9935f; --bad:#8d8fa8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif}
  h1{font-size:34px;line-height:1.25;margin:48px 0 12px;letter-spacing:1px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--muted);font-size:15px;margin:0 0 28px}
  .pie{width:100%;max-width:400px;margin:0 auto 18px}
  .r-img{display:block;width:62%;max-width:240px;margin:0 auto 12px}
  .share-img .r-img{width:58%}
  .pie svg{animation:fade .6s ease}
  .hb{transform-origin:170px 92px;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
  .pie svg{width:100%;height:100%;display:block;overflow:visible}
  .pie .seg{transform-origin:170px 170px;animation:pop .6s cubic-bezier(.2,.8,.3,1.2) both}
  .pie .lbl{font-size:14px;font-weight:600;fill:#fff;letter-spacing:1px;pointer-events:none}
  .pie .ctr1{font-size:19px;font-weight:600;fill:#6b605a;letter-spacing:3px}
  .pie .ctr2{font-size:12px;fill:var(--muted);letter-spacing:1px}
  @keyframes pop{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
  .modules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 28px}
  .modules div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
  .modules b{display:block;font-size:15px;margin-bottom:2px}
  .modules span{color:var(--muted);font-size:12.5px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px}
  button{font:inherit;cursor:pointer;border:none}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;letter-spacing:1px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:12px}
  .hidden{display:none!important}

  /* quiz */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .link{background:none;color:var(--muted);font-size:14px;padding:6px 0}
  .link:disabled{opacity:.3}
  .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .mod{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:8px}
  .q{font-size:21px;font-weight:600;line-height:1.45;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s}
  .opt.na{color:var(--muted);border-style:dashed}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .q.stmt{font-size:20px;margin:18px 0 34px;min-height:90px}
  .likert{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:stretch;gap:4px}
  .lk{flex:1;background:none;display:grid;grid-template-rows:56px auto;justify-items:center;align-items:center;row-gap:6px;padding:4px 0}
  .lk i{display:block;border-radius:50%;border:2.5px solid;transition:background .15s,transform .15s}
  .lk span{font-size:12px;color:var(--muted);white-space:nowrap}
  .lk0 i{width:50px;height:50px;border-color:#d0657a}
  .lk1 i{width:40px;height:40px;border-color:#e0939f}
  .lk2 i{width:32px;height:32px;border-color:#c4b6b8}
  .lk3 i{width:40px;height:40px;border-color:#a9abc0}
  .lk4 i{width:50px;height:50px;border-color:#8d8fa8}
  .lk0.sel i{background:#d0657a} .lk1.sel i{background:#e0939f} .lk2.sel i{background:#c4b6b8} .lk3.sel i{background:#a9abc0} .lk4.sel i{background:#8d8fa8}
  .lk.sel span{color:var(--ink);font-weight:600}
  .lk:active i{transform:scale(.92)}
  @media (hover:hover){.lk:hover i{transform:scale(1.06)}}
  .unk{display:block;margin:34px auto 0;width:auto;padding:9px 26px;font-size:14px;text-align:center}
  @media (hover:hover){.opt:hover{border-color:#ecbcc5}}

  /* result */
  #card{background:var(--bg);padding:4px 2px 2px}
  .r-head{text-align:center;margin:20px 0 8px}
  .r-title{font-size:15px;color:var(--accent);letter-spacing:2px;margin-bottom:14px}
  .r-label{font-size:13px;color:var(--muted);letter-spacing:2px}
  .score{font-size:72px;font-weight:700;line-height:1.1;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .score small{font-size:20px;color:var(--muted);font-weight:500}
  .verdict{font-size:24px;font-weight:700;margin:10px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
  .card h3{margin:0 0 12px;font-size:16px}
  .card p{margin:0 0 10px;font-size:15.5px}
  .card p:last-child{margin-bottom:0}
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
  .row-top b{font-variant-numeric:tabular-nums}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px}
  .row-note{font-size:13.5px;color:var(--muted);margin-top:5px}
  .flag{border-color:#ecc4cc;background:#fdf1f3}
  .flag h3{color:var(--accent)}
  .flag li{margin-bottom:4px}
  ul{margin:0;padding-left:20px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{background:var(--accent-soft);color:var(--accent);font-size:13.5px;padding:4px 10px;border-radius:20px}
  .tags.gray span{background:#f2ebec;color:var(--muted)}
  .brand{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:1px}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 保存图片弹层 */
  .overlay{position:fixed;inset:0;background:rgba(36,24,28,.95);z-index:10;display:flex;flex-direction:column}
  .ov-top{flex:none;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;text-align:center;color:#fff}
  .ov-top b{display:block;font-size:18px;margin-bottom:2px}
  .ov-top span{font-size:13.5px;opacity:.8}
  .ov-img{flex:1;overflow:auto;padding:0 16px;display:flex;justify-content:center}
  .ov-img img{width:100%;max-width:420px;height:auto;align-self:flex-start;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.35);-webkit-touch-callout:default}
  .ov-bar{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:452px;width:100%;margin:0 auto}
  .ov-bar button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
  .ov-save{background:var(--accent);color:#fff}
  .ov-close{background:rgba(255,255,255,.15);color:#fff}
  .legal-link{display:block;margin:22px auto 0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
  .legal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom))}
  .legal-in{max-width:560px;margin:0 auto}
  .legal h2{font-size:20px;margin:8px 0 16px}
  .legal h4{font-size:15px;margin:18px 0 6px}
  .legal p{font-size:14px;color:#4a413c;margin:0 0 8px}
  .gate{margin-bottom:4px}
  .code-input{display:block;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:18px;letter-spacing:2px;text-align:center;background:var(--card);color:var(--ink);margin-bottom:12px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .code-input:focus{outline:none;border-color:var(--accent)}
  .gate-msg{min-height:20px;font-size:14px;color:var(--bad);text-align:center;margin:10px 0 0}
  .gate-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
  /* 分享图专用排版：固定宽度、两侧留白、大标题 */
  .share-img{position:fixed;left:-9999px;top:0;width:420px;padding:36px 30px 30px;background:var(--bg)}
  .share-img .r-head{margin:0 0 6px}
  .share-img .r-title{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-bottom:10px;line-height:1.35}
  .share-img .r-label{font-size:13px}
  .share-img .verdict{font-size:30px}
  .share-img .verdict.big{font-size:36px}
  .share-img .score{font-size:80px}
  .share-img .card{padding:18px 18px;margin-top:16px}
  .share-img .card p{font-size:15px}
  .share-img .brand{font-size:14px;margin-top:22px;color:var(--ink);letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="intro" class="fade">
    <h1 class="serif">我们会<br><em>在一起</em>吗？</h1>
    <p class="lead">TA 喜不喜欢我？我们有没有可能？<br>算一算你们在一起的概率。</p>
    <div class="pie" id="pie"></div>
    <div class="note">25 道题，约 5 分钟，拿不准可以选「不清楚」。<br>按真实情况选，答案只留在你的手机上。</div>
    <div id="gate" class="gate hidden">
      <input id="codeInput" class="code-input" placeholder="输入兑换码" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="redeemBtn">验证并开始</button>
      <p class="gate-msg" id="gateMsg"></p>
      <p class="gate-hint">兑换码随商品一起发送，没收到的话请联系卖家</p>
    </div>
    <button class="btn" id="startBtn">开始测试</button>
    <button class="btn ghost hidden" id="resumeBtn">继续上次的进度</button>
    <button class="btn ghost hidden" id="lastBtn">查看上次的结果</button>
    <button class="legal-link" onclick="showLegal()">使用说明 · 隐私 · 免责声明</button>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="hidden">
    <div class="top">
      <button class="link" id="backBtn">‹ 上一题</button>
      <button class="link" id="homeBtn1">首页</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="qbox"></div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="hidden"></section>

</div>

<script>
// ---------- 题库 ----------
// 选项按从理想到不理想排列；[文字, 分数 0-4 或 null(不适用，不计分), 红线说明(可选)]
// 量表题：L(标签, 题目, 方向 1=符合越多越好 / -1=符合越多越差, 能否选“不清楚”)
const LIKERT = ["很符合","比较符合","一般","不太符合","很不符合"];
const L = (tag,q,k=1,u=false)=>({kind:"likert", tag, q, u,
  o:[...LIKERT.map((l,a)=>[l, k===1?4-a:a]), ...(u?[["不清楚",null]]:[])]});
// 程度题：五个圈，自定义标签（从高到低）
const S = (tag,q,labels)=>({kind:"likert", tag, q, u:false, o:labels.map((l,a)=>[l,4-a])});
const C = (tag,q,o)=>({kind:"choice", tag, q, o});

const MODULES = [
  { name:"TA的信号", key:"signal", qs:[
    S("暧昧程度","给你们现在的暧昧程度打个分",["像在恋爱","很暧昧","有点暧昧","好朋友","普通朋友"]),
    L("联系频率","我们几乎每天都会聊天"),
    L("谁更主动","大多数时候，是 TA 先来找我"),
    L("回消息","TA 回我消息很快，也很用心"),
    C("单独见面","最近一个月，你们单独见过几次面？",[
      ["3 次以上",4],["1–2 次",2.5],["没有单独见过",1],["不在一个城市，暂时见不了",null,null,"skip"]]),
    L("肢体接触","我们之间有过牵手、拥抱之类的肢体接触"),
    L("记得小事","TA 会记得我说过的小事",1,true),
    L("礼物和帮忙","TA 送过我礼物，或者特意帮过我的忙"),
    L("在意你身边的人","我提到别的异性时，TA 会明显在意",1,true),
    L("相处时的状态","和我在一起时，TA 看起来很放松、很开心",1,true),
  ]},
  { name:"现实条件", key:"reality", qs:[
    C("TA是否单身","TA 现在单身吗？",[["单身",4],["有对象",0,"taken"],["不清楚",null]]),
    C("TA喜欢的性别","TA 喜欢的性别包括你吗？",[["包括",4],["不包括",0,"orient"],["不清楚",null]]),
    C("TA单身多久","TA 单身多久了？",[
      ["3 个月到 5 年",4],["刚分手，不到 3 个月",1],["5 年以上，或从没谈过",1],["不清楚",null]]),
    L("TA在接触别人吗","TA 最近好像在和别人暧昧或约会",-1,true),
    C("未来一年是否异地","未来一年，你们会在同一个城市吗？",[
      ["会，一直在同一个城市",4],["现在异地，但很快会到一起",3],["会异地，或者可能分开",1],["不清楚",null]]),
    L("未来规划","我们对未来的规划（城市、工作、生活方式）比较合得上",1,true),
    L("共同话题","我们有很多共同话题或共同爱好"),
    L("TA的异性朋友","TA 身边的异性朋友很多",-1,true),
  ]},
  { name:"你这边", key:"you", qs:[
    L("你有多喜欢TA","我非常喜欢 TA"),
    C("你表达过吗","你有没有向 TA 表达过好感？",[
      ["表达过，TA 有回应",4],["还没表达过",2],["表达过，TA 没什么回应",1],["明确被拒绝过",0,"rejected"]]),
    C("你的感情经历","你自己的感情经历？",[["谈过几段",4],["谈过一两段",3],["还没谈过（母单）",1]]),
  ]},
  { name:"TA的状态", key:"ta", qs:[
    L("想脱单","TA 表达过想脱单、想谈恋爱",1,true),
    {...L("忽冷忽热","TA 对我会忽冷忽热",-1,true), avoid:true},
    {...L("靠近就后退","关系一变亲近，TA 就会突然冷淡或拉开距离",-1,true), avoid:true},
    {...L("很少谈感受","TA 很少聊自己的感受和过去",-1,true), avoid:true},
  ]},
];

// 每个方面按分数段（≥75 / 50–74 / <50）的点评
const MOD_NOTES = {
  signal:  ["TA 给出的信号很明确，这些通常不是“只是礼貌”。","有一些信号，但还不够集中，可能是好感，也可能只是友好。","目前 TA 的信号很弱。不一定是不喜欢，但至少还没有表现出来。"],
  reality: ["现实条件没有阻碍，就看你们俩了。","现实层面有一两件事，会影响你们的走向。","现实条件阻碍不小。喜欢很重要，但这些问题不会因为喜欢就消失。"],
  you:     ["你很清楚自己的心意，也已经迈出了步子。","你有心意，但还没有完全表达出来，或者自己也还在犹豫。","你自己还在观望，或者还没向 TA 表达过。"],
  ta:      ["TA 对感情的态度稳定、开放，是很好的信号。","TA 对恋爱有些犹豫，或者偶尔会退缩。","TA 现在可能不在适合恋爱的状态，或者有回避倾向，在靠近时容易后退。"],
};

const TIERS = [
  { min:85, img:"s0", title:"信号非常明确", color:"var(--good)",
    text:["你对 TA 的这份心意，从答题里就能感受到。而从你的描述来看，TA 也释放了很多好感信号，现实条件几乎没有阻碍，你们之间的互动已经明显超出了普通朋友。",
          "这样的阶段很珍贵，可以顺其自然地多相处、多了解彼此，让关系按你们自己的节奏往前走。",
          "这个结果反映的是你观察到的情况，TA 真实的想法，只有 TA 自己最清楚。"] },
  { min:70, img:"b0", title:"彼此很可能都有好感", color:"var(--good)",
    text:["喜欢一个人时，总会忍不住去猜对方的心思，这很正常。从你的描述来看，你们的互动频繁、自然，TA 对你也有不少回应。",
          "在大多数方面，你们之间都有往前走的基础。剩下的不确定不必着急，给彼此一点时间看清楚。",
          "感情里最好的节奏，是两个人都感到舒服的节奏。"] },
  { min:50, img:"s1", title:"有好感，但还不明朗", color:"var(--mid)",
    text:["能感受到你对 TA 的在意，也理解这种“好像有可能，又说不准”的心情。",
          "TA 对你有一些好感的表现，但信号还不够集中。也许 TA 自己还没想清楚，还在慢慢确认自己的心意。目前你们的关系，处在朋友和暧昧之间。",
          "这个阶段需要一点耐心，不必急着要一个答案。但如果很长时间都停在原地，让你一直在猜、一直在等，也可以允许自己慢慢放下。"] },
  { min:30, img:"b1", title:"目前更接近朋友", color:"var(--bad)",
    text:["喜欢一个人本身就很勇敢，这份心意值得被认真对待。",
          "从现有的信号看，TA 和你的相处更像朋友。这不代表没有可能，也许时机还不成熟，或者 TA 还没往这个方向想。",
          "可以继续做自己、自然地相处。如果过了一段时间仍然没有变化，把更多心思放回自己的生活里，也是一种对自己的温柔。"] },
  { min:0, img:"b2", title:"目前可能性较低", color:"var(--bad)",
    text:["这个结果可能不是你想看到的。先抱抱你，喜欢一个人没有错。",
          "从你的描述来看，TA 给出的信号较少，或者现实中有比较大的阻碍。这说明的是现在的情况，不是对你的评价。",
          "不必勉强自己立刻放下，难过也很正常。只是别让等待消耗太多的你，你值得一段不需要反复猜测的感情。"] },
];
// 最拖后腿的方面：一句解释
const LOW_NOTES = {
  signal:"TA 主动释放的信号还不多，可能还在观察，也可能本来就比较慢热。",
  reality:"现实条件有一些阻碍，比如距离、时机或 TA 的感情状况，这些往往需要时间。",
  you:"你自己这边还有一些保留，也许还在犹豫，或者还没让 TA 知道你的心意。",
  ta:"TA 自己可能还没调整好状态，比如对感情有些犹豫，或者靠近时容易后退。这通常和 TA 本身有关，不一定是因为你。",
};

// 一票否决的情况：概率上限和说明
const CAPS = {
  orient:  { cap:5,  title:"TA 喜欢的性别不包括你", text:"这一点通常不会因为相处而改变，所以概率按很低的范围计算。" },
  taken:   { cap:15, title:"TA 现在有对象", text:"在 TA 有伴侣的情况下，概率按很低的范围计算。" },
  rejected:{ cap:25, title:"你表白过，被拒绝了", text:"TA 已经给过一次明确的回答，所以概率按较低的范围计算。如果之后情况有变化，可以重新测一次。" },
};

// ---------- 状态 ----------
const QUESTIONS = [];
MODULES.forEach((m,mi)=>m.qs.forEach((q,qi)=>QUESTIONS.push({...q, mi, qi})));
const TOTAL = QUESTIONS.length;
let answers = new Array(TOTAL).fill(null);   // 按题目原始编号存
let order = [...Array(TOTAL).keys()];           // 本次答题的出题顺序
let cur = 0;                                    // 当前是第几题（按出题顺序）
const KEY = "together-quiz-v1";

// 打乱题目顺序；前 3 题不放红线类的重题，开头轻松一点
function makeOrder(){
  const heavy = new Set(QUESTIONS.map((q,i)=>q.o.some(o=>o[2])?i:-1).filter(i=>i>=0));
  let a;
  do{
    a=[...Array(TOTAL).keys()];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  }while(a.slice(0,3).some(i=>heavy.has(i)));
  return a;
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,order,cur}));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}
const LAST_KEY = "together-quiz-last-v1";
function saveLast(){try{localStorage.setItem(LAST_KEY,JSON.stringify({answers,time:Date.now()}));}catch(e){}}
function loadLast(){try{const l=JSON.parse(localStorage.getItem(LAST_KEY));return (l&&Array.isArray(l.answers)&&l.answers.length===TOTAL&&l.answers.every(a=>a!==null))?l:null;}catch(e){return null;}}

const $ = id=>document.getElementById(id);
function show(id){["intro","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

function goHome(){
  checkResume(); applyGate();
  show("intro");
}
function checkResume(){
  const has = answers.some(a=>a!==null) && answers.some(a=>a===null);
  $("resumeBtn").classList.toggle("hidden", !has);
  $("startBtn").textContent = has ? "重新开始" : "开始测试";
  const last = loadLast();
  if(last){const d=new Date(last.time);$("lastBtn").textContent=`查看上次的结果（${d.getMonth()+1}月${d.getDate()}日）`;}
  $("lastBtn").classList.toggle("hidden", !last);
}

function start(fresh){
  if(fresh){answers=new Array(TOTAL).fill(null);order=makeOrder();cur=0;save();}
  show("quiz");render();
}

function render(){
  const qi=order[cur], q=QUESTIONS[qi];
  $("count").textContent=`${cur+1} / ${TOTAL}`;
  $("bar").style.width=`${cur/TOTAL*100}%`;
  $("backBtn").disabled = cur===0;
  const box=$("qbox");
  if(q.kind==="likert"){
    const sc=q.o.slice(0,5);
    box.innerHTML=`<div class="fade">
      <p class="q stmt">${q.q}</p>
      <div class="likert">${sc.map((o,oi)=>`<button class="lk lk${oi}${answers[qi]===oi?" sel":""}" data-i="${oi}" aria-label="${o[0]}"><i></i><span>${o[0]}</span></button>`).join("")}</div>
      ${q.o[5]?`<button class="opt na unk${answers[qi]===5?" sel":""}" data-i="5">不清楚</button>`:""}
    </div>`;
  } else {
    box.innerHTML=`<div class="fade">
      <p class="q">${q.q}</p>
      <div class="opts">${q.o.map((o,oi)=>`<button class="opt${o[1]===null?" na":""}${answers[qi]===oi?" sel":""}" data-i="${oi}">${o[0]}</button>`).join("")}</div>
    </div>`;
  }
  box.querySelectorAll(".opt,.lk").forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
}

let locked=false;
function pick(i,btn){
  if(locked) return; locked=true;
  answers[order[cur]]=i; save();
  document.querySelectorAll(".opt,.lk").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel");
  setTimeout(()=>{
    locked=false;
    if(cur<TOTAL-1){cur++;save();render();}
    else {$("bar").style.width="100%";showResult();}
  },260);
}

$("backBtn").onclick=()=>{if(cur>0){cur--;save();render();}};
$("homeBtn1").onclick=goHome;
$("startBtn").onclick=()=>start(true);

// 通用码直接在本机验证（只存指纹，不存原码）；换码时更新这里
const LOCAL_CODES = ["693dc54a89c7e465a256323e67edce66885c632ec2fdf33008f9e958c8df5332"];
async function localCheck(code){
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("spello:"+code));
    const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    return LOCAL_CODES.includes(h); }catch(e){ return null; }
}
function isUnlocked(){ try{ return !!localStorage.getItem(UNLOCK_KEY); }catch(e){ return false; } }
function setUnlocked(code){ try{ localStorage.setItem(UNLOCK_KEY, code); }catch(e){} }

  const u=isUnlocked();

  $("startBtn").classList.toggle("hidden", !u);
  if(!u){ $("resumeBtn").classList.add("hidden"); $("lastBtn").classList.add("hidden"); }
}
async function callRedeem(code, direct){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),9000);
  try{
    const url = direct ? SB_URL+"/rest/v1/rpc/redeem_code" : "/api/rpc/redeem_code";
    const r=await fetch(url,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","apikey":SB_KEY},
      body:JSON.stringify({p_code:code,p_device:deviceId(),p_quiz:"together"})});
    if(!r.ok) throw new Error("http "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// ---------- 计算结果 ----------
function compute(answers){
  const mods=MODULES.map(()=>({sum:0,max:0}));
  const caps=[], weak=[], unknown=[];
  QUESTIONS.forEach((q,i)=>{
    const o=q.o[answers[i]];
    if(o[1]===null){ if(o[3]!=="skip") unknown.push(q.tag); return; }
    mods[q.mi].sum+=o[1]; mods[q.mi].max+=4;
    if(o[2]) caps.push(o[2]);
    else if(o[1]<=1) weak.push(q.tag);
  });
  const valid = mods.map((m,i)=>m.max?{i,s:Math.round(m.sum/m.max*100)}:{i,s:null});
  const scored = valid.filter(v=>v.s!==null);
  // TA 的信号最重要，TA 的状态和现实条件其次，你自己这边影响最小
  const W = {signal:1.6, reality:1.0, you:0.7, ta:1.2};
  const wsum = scored.reduce((a,v)=>a+W[MODULES[v.i].key],0);
  let total = wsum ? Math.round(scored.reduce((a,v)=>a+v.s*W[MODULES[v.i].key],0)/wsum) : 50;
  total = Math.max(1, Math.min(99, total));
  caps.forEach(c=>{ total=Math.min(total, CAPS[c].cap); });
  // 回避倾向：三道回避题里，答了的平均分偏低（即比较符合）
  const av=QUESTIONS.map((q,i)=>q.avoid?q.o[answers[i]][1]:null).filter(v=>v!==null);
  const avoid = av.length>=2 && av.reduce((a,b)=>a+b,0)/av.length<=1.5;
  return {modScores:valid.map(v=>v.s),total,caps,weak,unknown,avoid};
}
function colorFor(s){return s>=70?"var(--good)":s>=50?"var(--mid)":"var(--bad)";}

function showResult(ans, time){
  const fromHistory = !!ans;
  if(!fromHistory){ans=answers; saveLast(); clearSave(); answers=new Array(TOTAL).fill(null); cur=0;}
  const {modScores,total,caps,weak,unknown,avoid}=compute(ans);
  const d=new Date(time||Date.now()), dateStr=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  const tier = TIERS.find(t=>total>=t.min);
  const rows = MODULES.map((m,i)=>{
    const s=modScores[i];
    if(s===null) return `<div class="row"><div class="row-top"><span>${m.name}</span><b style="color:var(--muted)">—</b></div><div class="row-note">这部分还不清楚，暂不计分。</div></div>`;
    const band = s>=75?0:s>=50?1:2;
    return `<div class="row">
      <div class="row-top"><span>${m.name}</span><b style="color:${colorFor(s)}">${s}</b></div>
      <div class="track"><i style="width:${Math.max(s,3)}%;background:${colorFor(s)}"></i></div>
      <div class="row-note no-img">${MOD_NOTES[m.key][band]}</div>
    </div>`;}).join("");
  const sc = modScores.map((s,i)=>({s,i})).filter(x=>x.s!==null);
  const lo = sc.length ? sc.reduce((a,b)=>b.s<a.s?b:a) : null;
  const hl = (!caps.length && lo && lo.s<60) ? `<p>目前最拖后腿的是<b>「${MODULES[lo.i].name}」</b>：${LOW_NOTES[MODULES[lo.i].key]}</p>` : "";
  const capCards = [...new Set(caps)].map(c=>`<div class="card flag"><h3>${CAPS[c].title}</h3><p>${CAPS[c].text}</p></div>`).join("");

  $("result").innerHTML = `<div class="fade">
    <div class="top">
      <button class="link" id="homeBtn2">‹ 首页</button>
    </div>
    <div id="card">
      <div class="r-head">
        <div class="r-title serif">我们会在一起吗？</div>
        <img class="r-img" src="img/${tier.img}.webp" alt="">
        <div class="r-label">在一起的概率 · ${dateStr}</div>
        <div class="score" style="color:${tier.color}">${total}<small> %</small></div>
        <div class="verdict serif" style="color:${tier.color}">${tier.title}</div>
      </div>
      ${capCards}
      <div class="card no-img"><p>${tier.text[0]}</p>${hl}${tier.text.slice(1).map(t=>`<p>${t}</p>`).join("")}</div>
      ${avoid?`<div class="card flag no-img"><h3>TA 可能有一些回避倾向</h3><p>从你的描述看，TA 在关系变近时容易后退，也不太谈自己的感受。有回避倾向的人，常常不是不喜欢，而是亲密会让 TA 本能地紧张，所以信号会显得时有时无。</p></div>`:""}
      <div class="card"><h3>四个方面</h3>${rows}</div>
      ${unknown.length>=5?`<div class="card no-img"><p class="row-note" style="margin:0">你有 ${unknown.length} 道题选了「不清楚」，这部分没有计入概率，结果的参考价值会打一些折扣。</p></div>`:""}
      <div class="brand no-img">test.spelloapp.com/together</div>
    </div>
    <button class="btn" id="saveBtn" style="margin-top:24px">保存结果图片</button>
    <button class="btn ghost" id="againBtn">重新测一次</button>
    <p class="foot">本测试仅供娱乐和自我觉察参考，不构成专业的心理或情感咨询。<br>TA 的心意，最终还是要 TA 自己告诉你。</p>
    <button class="legal-link" onclick="showLegal()">使用说明 · 隐私 · 免责声明</button>
  </div>`;
  $("homeBtn2").onclick=goHome;
  $("againBtn").onclick=()=>start(true);
  $("saveBtn").onclick=saveImage;
  show("result");
}

// ---------- 保存图片 ----------
let h2cLoading=null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cLoading) h2cLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src="html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return h2cLoading;
}
async function saveImage(){
  const btn=$("saveBtn"); const old=btn.textContent;
  btn.textContent="生成中…"; btn.disabled=true;
  try{
    await loadH2C();
    const holder=document.createElement("div"); holder.className="share-img";
    holder.appendChild($("card").cloneNode(true)); holder.firstChild.removeAttribute("id");
    holder.querySelectorAll(".no-img").forEach(e=>e.remove());
    document.body.appendChild(holder);
    const bg=getComputedStyle(document.body).backgroundColor;
    let canvas;
    try{ canvas = await html2canvas(holder,{backgroundColor:bg,scale:2.5,useCORS:true,windowWidth:420,x:0,y:0}); }
    finally{ holder.remove(); }
    const url = canvas.toDataURL("image/jpeg",0.92);
    const blob = await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.92));
    const file = blob && new File([blob],"我们会在一起吗-结果.jpg",{type:"image/jpeg"});
    const inApp = /MicroMessenger|xhsdiscover|XiaoHongShu|Weibo|QQ\/|DingTalk|aweme|Lark/i.test(navigator.userAgent);
    const desktop = window.matchMedia("(hover:hover)").matches;
    const canShare = !desktop && file && navigator.canShare && navigator.canShare({files:[file]});

    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`
      <div class="ov-top">
        <b>${desktop?"图片已下载":canShare?"点下方按钮保存到相册":"长按图片 → 保存图片"}</b>
        <span>${desktop?"在下载文件夹里可以找到":canShare?"在弹出的菜单里选「存储图像」或「保存图片」":inApp?"长按没反应的话：点右上角「…」选择在浏览器打开，或者直接截图":"图片还没有保存，记得长按哦；不行的话直接截图也可以"}</span>
      </div>
      <div class="ov-img"><img src="${url}" alt="测试结果"></div>
      <div class="ov-bar">
        ${canShare?`<button class="ov-save">保存到相册</button>`:""}
        <button class="ov-close">${canShare?"关闭":"我保存好了"}</button>
      </div>`;
    ov.querySelector(".ov-close").onclick=()=>ov.remove();
    const sv=ov.querySelector(".ov-save");
    if(sv) sv.onclick=async()=>{
      try{ await navigator.share({files:[file]}); sv.textContent="已保存 ✓"; }
      catch(e){ if(e && e.name!=="AbortError") ov.querySelector(".ov-top span").textContent="没成功的话，长按图片也可以保存"; }
    };
    document.body.appendChild(ov);
    if(desktop){ const a=document.createElement("a"); a.href=url; a.download="我们会在一起吗-结果.jpg"; a.click(); }
  }catch(e){
    alert("生成图片失败，可以直接截图保存哦");
  }finally{btn.textContent=old;btn.disabled=false;}
}
